<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gomoku</title>
<link rel="stylesheet" href="shared.css">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="../themes/themes.css">
<script src="../themes/themes.js" defer></script>
<script src="../lang/lang.js" defer></script>
<style>
.gm-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px;}
.gm-board{
  display:grid;background:linear-gradient(145deg,#caa066,#b0864a);
  border:3px solid #7a5a2a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.5);
  padding:6px;touch-action:manipulation;
}
.gm-cell{
  position:relative;cursor:pointer;box-sizing:border-box;
  border-right:1px solid rgba(60,40,10,.5);border-bottom:1px solid rgba(60,40,10,.5);
}
.gm-cell::after{content:'';position:absolute;inset:0;}
.gm-stone{position:absolute;inset:11%;border-radius:50%;pointer-events:none;}
.gm-stone.b{background:radial-gradient(circle at 34% 30%,#555,#000);box-shadow:0 1px 3px rgba(0,0,0,.6);}
.gm-stone.w{background:radial-gradient(circle at 34% 30%,#fff,#bbb);box-shadow:0 1px 3px rgba(0,0,0,.4);}
.gm-stone.last{outline:2px solid var(--accent);outline-offset:-1px;border-radius:50%;}
.gm-status{font-family:'Orbitron',monospace;font-size:15px;font-weight:700;letter-spacing:1px;min-height:22px;}
</style>
</head>
<body>
<div class="hdr">
  <a class="back-btn" href="../index.html">← HUB</a>
  <span class="h-title" style="color:#c080e0">⚫ GOMOKU</span>
  <div class="h-btns">
    <select id="mode-sel" onchange="newGame()">
      <option value="2p">2 PLAYERS</option>
      <option value="ai" selected>VS AI</option>
    </select>
    <select id="size-sel" onchange="newGame()">
      <option value="13">13×13</option>
      <option value="15" selected>15×15</option>
    </select>
    <button class="hbtn" onclick="newGame()">NEW GAME</button>
  </div>
</div>

<div class="gm-wrap">
  <div class="gm-status" id="status">⚫ BLACK'S TURN</div>
  <div id="board" class="gm-board"></div>
</div>

<div id="win-overlay">
  <div class="win-msg" id="win-msg">🏆 WIN!</div>
  <div class="win-sub" id="win-sub"></div>
  <div class="win-btns">
    <button class="win-btn" onclick="newGame()">PLAY AGAIN</button>
    <button class="win-btn sec" onclick="location.href='../index.html'">← HUB</button>
  </div>
</div>

<script>
let SZ=15, bd=[], turn='b', over=false, mode='ai', last=-1, thinking=false;
const DIRS=[[0,1],[1,0],[1,1],[1,-1]];

function newGame(){
  SZ=parseInt(document.getElementById('size-sel').value,10);
  mode=document.getElementById('mode-sel').value;
  document.getElementById('win-overlay').classList.remove('show');
  bd=Array(SZ*SZ).fill(0); // 0 empty, 1 black, 2 white
  turn='b'; over=false; last=-1; thinking=false;
  render(); status();
}

function idx(r,c){return r*SZ+c;}
function inB(r,c){return r>=0&&r<SZ&&c>=0&&c<SZ;}

function place(p){
  if(over||thinking||bd[p]) return;
  if(mode==='ai'&&turn==='w') return; // AI controls white
  doPlace(p, turn==='b'?1:2);
  if(over) return;
  if(mode==='ai'&&turn==='w'){ thinking=true; status(); setTimeout(aiMove,320); }
}

function doPlace(p,who){
  bd[p]=who; last=p;
  render();
  if(checkWin(p,who)){ endGame(who); return; }
  if(bd.every(v=>v)){ endGame(0); return; }
  turn = turn==='b'?'w':'b';
  status();
}

function checkWin(p,who){
  const r=(p/SZ)|0, c=p%SZ;
  for(const [dr,dc] of DIRS){
    let n=1;
    for(let s=1;s<5;s++){const rr=r+dr*s,cc=c+dc*s; if(inB(rr,cc)&&bd[idx(rr,cc)]===who)n++;else break;}
    for(let s=1;s<5;s++){const rr=r-dr*s,cc=c-dc*s; if(inB(rr,cc)&&bd[idx(rr,cc)]===who)n++;else break;}
    if(n>=5) return true;
  }
  return false;
}

function endGame(who){
  over=true; thinking=false;
  const msg = who===0?'🤝 DRAW!':(who===1?'⚫ BLACK WINS!':'⚪ WHITE WINS!');
  document.getElementById('status').textContent=msg;
  document.getElementById('win-msg').textContent=who===0?'🤝 DRAW':'🏆 '+(who===1?'BLACK':'WHITE')+' WINS!';
  document.getElementById('win-sub').textContent = mode==='ai' ? (who===1?'You beat the AI!':who===2?'The AI wins.':'') : '';
  setTimeout(()=>document.getElementById('win-overlay').classList.add('show'),350);
}

function status(){
  if(over) return;
  const el=document.getElementById('status');
  if(thinking){ el.textContent='🤖 AI THINKING…'; return; }
  const you = turn==='b';
  el.textContent = turn==='b' ? '⚫ BLACK'+(mode==='ai'?' (YOU)':'')+'’S TURN' : '⚪ WHITE'+(mode==='ai'?' (AI)':'')+'’S TURN';
}

/* ---- AI: heuristic cell scoring ---- */
function aiMove(){
  const p=bestMove(2); // white
  thinking=false;
  if(p<0){ endGame(0); return; }
  doPlace(p,2);
}

function lineScore(p,who){
  // score potential around empty cell p for player `who`
  const r=(p/SZ)|0, c=p%SZ; let score=0;
  for(const [dr,dc] of DIRS){
    let count=1, openEnds=0, blocked=0;
    // forward
    let s=1;
    while(s<5){const rr=r+dr*s,cc=c+dc*s; if(inB(rr,cc)&&bd[idx(rr,cc)]===who){count++;s++;}else{ if(inB(rr,cc)&&bd[idx(rr,cc)]===0)openEnds++; else blocked++; break;}}
    s=1;
    while(s<5){const rr=r-dr*s,cc=c-dc*s; if(inB(rr,cc)&&bd[idx(rr,cc)]===who){count++;s++;}else{ if(inB(rr,cc)&&bd[idx(rr,cc)]===0)openEnds++; else blocked++; break;}}
    if(count>=5) score+=1000000;
    else if(count===4) score+= openEnds>=1 ? 50000 : 3000;
    else if(count===3) score+= openEnds>=2 ? 6000 : (openEnds===1?600:0);
    else if(count===2) score+= openEnds>=2 ? 400 : (openEnds===1?80:0);
    else score+= openEnds>=1?15:0;
  }
  return score;
}

function bestMove(who){
  const opp = who===1?2:1;
  // candidate cells: empties adjacent to any stone (+ center on empty board)
  const cand=[];
  if(bd.every(v=>!v)) return idx((SZ/2)|0,(SZ/2)|0);
  const near=new Set();
  for(let p=0;p<bd.length;p++) if(bd[p]){
    const r=(p/SZ)|0,c=p%SZ;
    for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){const rr=r+dr,cc=c+dc; if(inB(rr,cc)&&!bd[idx(rr,cc)])near.add(idx(rr,cc));}
  }
  let best=-1,bestVal=-Infinity;
  near.forEach(p=>{
    const attack=lineScore(p,who);         // my gain
    const defend=lineScore(p,opp)*0.9;     // block opponent
    const v=Math.max(attack,defend)+Math.min(attack,defend)*0.1;
    if(v>bestVal){bestVal=v;best=p;}
  });
  return best;
}

function render(){
  const b=document.getElementById('board');
  if(!b) return;
  const avail=Math.min(window.innerWidth-28, window.innerHeight-170, 600);
  const cell=Math.floor(avail/SZ);
  b.style.gridTemplateColumns=`repeat(${SZ},${cell}px)`;
  b.innerHTML='';
  for(let p=0;p<SZ*SZ;p++){
    const d=document.createElement('div');
    d.className='gm-cell';
    d.style.width=cell+'px'; d.style.height=cell+'px';
    if(bd[p]){
      const s=document.createElement('div');
      s.className='gm-stone '+(bd[p]===1?'b':'w')+(p===last?' last':'');
      d.appendChild(s);
    }
    d.onclick=()=>place(p);
    b.appendChild(d);
  }
}
window.addEventListener('resize',()=>{ if(bd.length) render(); });
newGame();
</script>
</body>
</html>
