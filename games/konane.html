<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Konane</title>
<link rel="stylesheet" href="shared.css">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="../themes/themes.css">
<script src="../themes/themes.js" defer></script>
<script src="../lang/lang.js" defer></script>
<style>
.kn-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px;}
.kn-board{display:grid;background:#3a2a1a;border:3px solid #5a4a2a;border-radius:6px;padding:4px;gap:3px;box-shadow:0 6px 24px rgba(0,0,0,.5);}
.kn-cell{border-radius:50%;background:#241810;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;}
.kn-stone{width:78%;height:78%;border-radius:50%;}
.kn-stone.b{background:radial-gradient(circle at 34% 30%,#555,#000);} .kn-stone.w{background:radial-gradient(circle at 34% 30%,#fff,#ccc);}
.kn-cell.sel{box-shadow:inset 0 0 0 3px var(--accent);}
.kn-cell.dest::after{content:'';position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(64,192,160,.7);}
.kn-status{font-family:'Orbitron',monospace;font-size:14px;font-weight:700;min-height:20px;}
.kn-hint{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--dim);text-align:center;max-width:440px;line-height:1.6;}
</style>
</head>
<body>
<div class="hdr">
  <a class="back-btn" href="../index.html">← HUB</a>
  <span class="h-title" style="color:#c080e0">⚫ KONANE</span>
  <div class="h-btns"><select id="mode-sel" onchange="newGame()"><option value="2p">2 PLAYERS</option><option value="ai" selected>VS AI</option></select><button class="hbtn" onclick="newGame()">NEW GAME</button></div>
</div>
<div class="kn-wrap">
  <div class="kn-status" id="status">Black: remove one of your stones to start</div>
  <div class="kn-hint">Hawaiian checkers. After the opening, <b>jump orthogonally over an enemy</b> into an empty spot to capture (chain allowed). The player who can't move <b>loses</b>.</div>
  <div id="board" class="kn-board"></div>
</div>
<div id="win-overlay">
  <div class="win-msg" id="win-msg">🏆 YOU WIN!</div>
  <div class="win-sub" id="win-sub"></div>
  <div class="win-btns"><button class="win-btn" onclick="newGame()">PLAY AGAIN</button><button class="win-btn sec" onclick="location.href='../index.html'">← HUB</button></div>
</div>
<script>
const GAME='konane';
function sfx(n){try{if(window.GH)GH.sfx.play(n);}catch(e){}}
const N=6; let bd=[], turn=1, phase='open1', mode='ai', sel=null, dests=[], over=false, busy=false;
// 1=black(you), 2=white(ai). phases: open1(black removes), open2(white removes adj), play
function newGame(){ mode=document.getElementById('mode-sel').value; bd=Array.from({length:N},()=>Array(N).fill(0));
  for(let r=0;r<N;r++)for(let c=0;c<N;c++) bd[r][c]=((r+c)%2===0)?1:2; // alternate
  turn=1; phase='open1'; sel=null; dests=[]; over=false; busy=false;
  document.getElementById('win-overlay').classList.remove('show'); render(); status(); }
function inB(r,c){ return r>=0&&r<N&&c>=0&&c<N; }
function jumps(r,c){ const p=bd[r][c]; const opp=p===1?2:1; const out=[];
  for(const [dr,dc] of [[0,2],[0,-2],[2,0],[-2,0]]){ const mr=r+dr/2,mc=c+dc/2,nr=r+dr,nc=c+dc; if(inB(nr,nc)&&bd[nr][nc]===0&&bd[mr][mc]===opp) out.push([nr,nc]); }
  return out; }
function anyJump(p){ for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(bd[r][c]===p&&jumps(r,c).length)return true; return false; }
function click(r,c){ if(over||busy)return; if(mode==='ai'&&turn===2&&phase!=='open2'&&phase!=='play')return; if(mode==='ai'&&turn===2)return;
  if(phase==='open1'){ if(bd[r][c]===1){ bd[r][c]=0; sfx('place'); phase='open2'; turn=2; render(); status(); if(mode==='ai'){busy=true;setTimeout(aiOpen,500);} else status(); } return; }
  if(phase==='open2'){ // player 2 (2P mode) removes a white stone next to a gap
    if(bd[r][c]===2){ const adjGap=[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].some(([rr,cc])=>inB(rr,cc)&&bd[rr][cc]===0); if(adjGap){ bd[r][c]=0; sfx('place'); phase='play'; turn=1; render(); status(); } else sfx('error'); }
    return; }
  // play phase
  if(bd[r][c]===turn && jumps(r,c).length){ sel=[r,c]; dests=jumps(r,c); render(); return; }
  if(sel&&dests.some(([dr,dc])=>dr===r&&dc===c)){ doJump(sel[0],sel[1],r,c); } }
function aiOpen(){ // white removes a stone orthogonally adjacent to the empty gap
  const gaps=[]; for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(bd[r][c]===0)gaps.push([r,c]);
  const [gr,gc]=gaps[0]; const opts=[[gr-1,gc],[gr+1,gc],[gr,gc-1],[gr,gc+1]].filter(([r,c])=>inB(r,c)&&bd[r][c]===2);
  const [r,c]=opts[0|Math.random()*opts.length]; bd[r][c]=0; sfx('place'); phase='play'; turn=1; busy=false; render(); status();
}
function doJump(r,c,nr,nc){ const p=bd[r][c]; const mr=(r+nr)/2,mc=(c+nc)/2; bd[nr][nc]=p; bd[r][c]=0; bd[mr][mc]=0; sfx('hit');
  // chain: same piece can continue jumping in any direction
  const more=jumps(nr,nc);
  if(more.length){ sel=[nr,nc]; dests=more; render(); return; } // let player continue (click a dest)
  sel=null; dests=[]; render(); endTurn(p); }
function endTurn(p){ const opp=p===1?2:1; if(!anyJump(opp)) return win(p); turn=opp; status(); if(mode==='ai'&&turn===2&&!over){ busy=true; status(); setTimeout(aiMove,400); } }
function aiMove(){ if(over)return; // pick a stone with jumps, do a (possibly chained) capture greedily maximizing captures
  let bestStart=null,bestPath=null,bestLen=-1;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){ if(bd[r][c]!==2)continue; const path=greedyChain(r,c); if(path.length>bestLen){bestLen=path.length;bestStart=[r,c];bestPath=path;} }
  busy=false;
  if(!bestStart||bestLen===0){ return win(1); }
  // execute path
  let [cr,cc]=bestStart; for(const [nr,nc] of bestPath){ const mr=(cr+nr)/2,mc=(cc+nc)/2; bd[nr][nc]=2; bd[cr][cc]=0; bd[mr][mc]=0; cr=nr;cc=nc; } sfx('hit'); render(); endTurn(2);
}
function greedyChain(r,c){ // returns array of destinations for a max-ish chain (greedy DFS)
  let best=[]; const dfs=(cr,cc,path)=>{ const js=jumps(cr,cc); if(!js.length){ if(path.length>best.length)best=path.slice(); return; } let moved=false;
    for(const [nr,nc] of js){ const mr=(cr+nr)/2,mc=(cc+nc)/2; const sm=bd[mr][mc],sc=bd[cr][cc]; bd[nr][nc]=2;bd[cr][cc]=0;bd[mr][mc]=0; path.push([nr,nc]); dfs(nr,nc,path); path.pop(); bd[cr][cc]=sc;bd[mr][mc]=sm;bd[nr][nc]=0; moved=true; }
    if(!moved && path.length>best.length)best=path.slice(); };
  dfs(r,c,[]); return best; }
function render(){ const b=document.getElementById('board'); const cell=Math.floor(Math.min(window.innerWidth-30,420)/N); b.style.gridTemplateColumns=`repeat(${N},${cell}px)`; b.innerHTML='';
  const destSet=new Set(dests.map(d=>d.join(','))); for(let r=0;r<N;r++)for(let c=0;c<N;c++){ const d=document.createElement('div'); d.className='kn-cell'+(sel&&sel[0]===r&&sel[1]===c?' sel':'')+(destSet.has(r+','+c)?' dest':''); d.style.width=cell+'px'; d.style.height=cell+'px'; if(bd[r][c]){const s=document.createElement('div');s.className='kn-stone '+(bd[r][c]===1?'b':'w');d.appendChild(s);} d.onclick=()=>click(r,c); b.appendChild(d); } }
function status(){ if(over)return; const el=document.getElementById('status'); if(phase==='open1'){el.textContent='⚫ Remove one of YOUR stones to begin';return;} if(phase==='open2'){el.textContent='⚪ Opponent removes a stone…';return;} el.textContent=busy?'🤖 AI thinking…':(turn===1?'⚫ Your move (capture)':'⚪ Player 2 move'); }
function win(p){ over=true; busy=false; const youWin=p===1; if(youWin&&mode==='ai'&&window.GH)GH.score.inc(GAME,'wins',1); document.getElementById('win-msg').textContent=youWin?'🏆 YOU WIN!':(mode==='ai'?'🤖 AI WINS!':'🏆 PLAYER 2 WINS!'); document.getElementById('win-sub').textContent='Opponent has no moves left!'; setTimeout(()=>document.getElementById('win-overlay').classList.add('show'),350); }
window.addEventListener('resize',()=>{ if(bd.length)render(); });
newGame();
</script>
</body>
</html>
