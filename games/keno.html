<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keno</title>
<link rel="stylesheet" href="shared.css">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="../themes/themes.css">
<script src="../themes/themes.js" defer></script>
<script src="../lang/lang.js" defer></script>
<style>
.kn-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 12px;}
.kn-credit{font-family:'Orbitron',monospace;font-size:16px;}.kn-credit b{color:#f0c040;font-size:24px;}
.kn-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:440px;width:100%;}
.kn-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-size:13px;font-weight:700;border-radius:6px;background:var(--surface);border:2px solid var(--border);cursor:pointer;transition:transform .1s;}
.kn-cell.pick{background:var(--accent);color:#0a0a14;border-color:var(--accent);}
.kn-cell.drawn{box-shadow:0 0 0 2px #f0c040 inset;}
.kn-cell.hit{background:var(--green);color:#071407;border-color:var(--green);animation:pop .3s;}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.kn-msg{font-family:'Orbitron',monospace;font-size:14px;min-height:22px;text-align:center;}
.kn-ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;}
.kn-b{font-family:'Orbitron',monospace;font-size:14px;font-weight:700;padding:11px 24px;border-radius:10px;border:3px solid var(--green);background:var(--green);color:#0a140a;cursor:pointer;}
.kn-b.sec{border-color:var(--border);background:var(--surface);color:var(--fg);}
.kn-b:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<div class="hdr">
  <a class="back-btn" href="../index.html">← HUB</a>
  <span class="h-title" style="color:#40c0a0">🎱 KENO</span>
  <div class="h-btns"><button class="hbtn" onclick="reset()">RESET</button></div>
</div>
<div class="kn-wrap">
  <div class="kn-credit">CREDITS: <b id="credit">100</b> · BET 10</div>
  <div class="kn-msg" id="msg">Pick up to 10 numbers, then play.</div>
  <div class="kn-grid" id="grid"></div>
  <div class="kn-ctrl">
    <button class="kn-b sec" id="quick" onclick="quick()">⚡ QUICK PICK</button>
    <button class="kn-b sec" id="clear" onclick="clearPicks()">CLEAR</button>
    <button class="kn-b" id="play" onclick="play()">▶ PLAY (bet 10)</button>
  </div>
</div>
<div id="win-overlay">
  <div class="win-msg" id="win-msg">💸 BROKE</div>
  <div class="win-sub" id="win-sub"></div>
  <div class="win-btns"><button class="win-btn" onclick="reset()">NEW STAKE</button><button class="win-btn sec" onclick="location.href='../index.html'">← HUB</button></div>
</div>
<script>
const GAME='keno';
function sfx(n){try{if(window.GH)GH.sfx.play(n);}catch(e){}}
// payout multiplier per [picks][hits]
const PAY={1:{1:3},2:{2:12},3:{2:1,3:42},4:{2:1,3:4,4:120},5:{3:2,4:12,5:300},6:{3:1,4:4,5:40,6:800},7:{4:2,5:12,6:80,7:1500},8:{5:6,6:40,7:300,8:4000},9:{5:3,6:12,7:80,8:800,9:8000},10:{5:2,6:8,7:40,8:200,9:1000,10:20000}};
const BET=10;
let picks=new Set(), credit=100, busy=false, over=false;
function reset(){ picks.clear(); credit=100; busy=false; over=false; document.getElementById('win-overlay').classList.remove('show'); render(); upd(); setMsg('Pick up to 10 numbers, then play.'); }
function upd(){ document.getElementById('credit').textContent=credit; document.getElementById('play').disabled=busy||picks.size===0||credit<BET; document.getElementById('quick').disabled=busy; document.getElementById('clear').disabled=busy; }
function setMsg(t){ document.getElementById('msg').textContent=t; }
function render(){ const g=document.getElementById('grid'); g.innerHTML=''; for(let i=1;i<=80;i++){ const d=document.createElement('div'); d.className='kn-cell'+(picks.has(i)?' pick':''); d.textContent=i; d.onclick=()=>toggle(i); g.appendChild(d); } }
function toggle(n){ if(busy)return; if(picks.has(n))picks.delete(n); else { if(picks.size>=10){ setMsg('Max 10 numbers.'); return; } picks.add(n); } render(); upd(); }
function quick(){ if(busy)return; picks.clear(); const k=5; while(picks.size<k)picks.add(1+(0|Math.random()*80)); render(); upd(); setMsg('Quick-picked '+k+' numbers.'); }
function clearPicks(){ if(busy)return; picks.clear(); render(); upd(); }
function play(){ if(busy||over||picks.size===0||credit<BET)return; busy=true; credit-=BET; upd(); setMsg('Drawing 20 numbers…'); if(window.GH)GH.chip('#grid',{count:3});
  const pool=[]; for(let i=1;i<=80;i++)pool.push(i); for(let i=pool.length-1;i>0;i--){const j=0|Math.random()*(i+1);[pool[i],pool[j]]=[pool[j],pool[i]];}
  const drawn=pool.slice(0,20); const cells=[...document.querySelectorAll('.kn-cell')];
  drawn.forEach((n,i)=>{ setTimeout(()=>{ const el=cells[n-1]; if(picks.has(n)){ el.classList.add('hit'); sfx('pop'); } else el.classList.add('drawn'); }, i*70); });
  setTimeout(()=>{ const hits=drawn.filter(n=>picks.has(n)).length; const table=PAY[picks.size]||{}; const mult=table[hits]||0; const winAmt=BET*mult;
    if(winAmt>0){ credit+=winAmt; sfx('win'); setMsg(hits+' / '+picks.size+' hits — WIN '+winAmt+'!'); if(window.GH)GH.chip('#credit',{count:Math.min(8,2+hits),color:'#40d070'}); } else { sfx('lose'); setMsg(hits+' / '+picks.size+' hits — no win.'); }
    busy=false; upd();
    if(credit<BET){ over=true; document.getElementById('win-sub').textContent='Not enough credits to play on.'; setTimeout(()=>document.getElementById('win-overlay').classList.add('show'),500); }
    else if(window.GH)GH.score.best(GAME,'best',credit,'high');
  }, 20*70+400);
}
reset();
</script>
</body>
</html>
