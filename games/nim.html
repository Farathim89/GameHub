<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nim</title>
<link rel="stylesheet" href="shared.css">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="../themes/themes.css">
<script src="../themes/themes.js" defer></script>
<script src="../lang/lang.js" defer></script>
<style>
.nm-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:18px 12px;}
.nm-rows{display:flex;flex-direction:column;gap:14px;background:var(--surface);padding:18px 22px;border-radius:14px;border:2px solid var(--border);}
.nm-row{display:flex;gap:8px;align-items:center;min-height:40px;}
.nm-tok{width:18px;height:40px;border-radius:5px;background:linear-gradient(145deg,#e06030,#a03810);border:2px solid #ffb080;cursor:pointer;transition:transform .1s,opacity .15s;}
.nm-tok:hover{transform:translateY(-4px);}
.nm-tok.pick{background:linear-gradient(145deg,#f0c040,#c08000);border-color:#ffe090;transform:translateY(-6px);}
.nm-tok.gone{opacity:0;pointer-events:none;}
.nm-turn{font-family:'Orbitron',monospace;font-size:16px;font-weight:700;min-height:24px;letter-spacing:1px;}
.nm-hint{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--dim);text-align:center;max-width:440px;line-height:1.6;}
.nm-take{font-family:'Orbitron',monospace;font-size:14px;font-weight:700;padding:10px 22px;border-radius:9px;border:2px solid var(--green);color:var(--green);background:var(--surface);cursor:pointer;letter-spacing:1px;}
.nm-take:disabled{opacity:.4;cursor:default;}
</style>
</head>
<body>
<div class="hdr">
  <a class="back-btn" href="../index.html">← HUB</a>
  <span class="h-title" style="color:#e06030">🪵 NIM</span>
  <div class="h-btns">
    <select id="rule-sel" onchange="newGame()">
      <option value="normal" selected>LAST TAKES = WINS</option>
      <option value="misere">LAST TAKES = LOSES</option>
    </select>
    <div class="info-pill">WINS: <span id="wins">0</span></div>
    <button class="hbtn" onclick="newGame()">NEW GAME</button>
  </div>
</div>
<div class="nm-wrap">
  <div class="nm-hint">Take any number of sticks from <b>one</b> row per turn. Click sticks in a row, then “Take”.</div>
  <div class="nm-turn" id="turn">Your turn</div>
  <div class="nm-rows" id="rows"></div>
  <button class="nm-take" id="take" onclick="takeSelected()" disabled>✓ TAKE</button>
</div>
<div id="win-overlay">
  <div class="win-msg" id="win-msg">🏆 YOU WIN!</div>
  <div class="win-sub" id="win-sub"></div>
  <div class="win-btns">
    <button class="win-btn" onclick="newGame()">PLAY AGAIN</button>
    <button class="win-btn sec" onclick="location.href='../index.html'">← HUB</button>
  </div>
</div>
<script>
const GAME='nim';
function sfx(n){try{if(window.GH)GH.sfx.play(n);}catch(e){}}
let heaps=[], picks={}, turn=0, over=false, misere=false, busy=false;
function newGame(){
  misere=document.getElementById('rule-sel').value==='misere';
  const sizes=[[3,4,5],[1,3,5,7],[2,3,4,5]][0|Math.random()*3];
  heaps=sizes.slice(); picks={}; turn=0; over=false; busy=false;
  document.getElementById('win-overlay').classList.remove('show');
  document.getElementById('wins').textContent=(window.GH?GH.score.get(GAME,'wins'):0)||0;
  render(); setTurn();
}
function render(){
  const rows=document.getElementById('rows'); rows.innerHTML='';
  heaps.forEach((n,ri)=>{
    const row=document.createElement('div'); row.className='nm-row';
    for(let i=0;i<n;i++){
      const t=document.createElement('div');
      const picked=(picks.row===ri && i>=n-picks.count);
      t.className='nm-tok'+(picked?' pick':'');
      t.onclick=()=>pickTo(ri,i);
      row.appendChild(t);
    }
    if(n===0){ const s=document.createElement('span'); s.style.cssText='color:var(--dim);font-family:Orbitron,monospace;font-size:12px'; s.textContent='(empty)'; row.appendChild(s); }
    rows.appendChild(row);
  });
  document.getElementById('take').disabled = !picks.count || over || turn!==0 || busy;
}
function pickTo(ri,i){
  if(over||turn!==0||busy) return;
  // picking index i in row ri selects (n-i) tokens from the right
  const take=heaps[ri]-i;
  picks={row:ri,count:take};
  sfx('select'); render();
}
function takeSelected(){
  if(!picks.count||turn!==0||over) return;
  heaps[picks.row]-=picks.count; picks={}; sfx('place');
  afterMove();
}
function afterMove(){
  render();
  if(ended()) return finish();
  turn=1-turn; setTurn();
  if(turn===1){ busy=true; setTimeout(aiMove,650); }
}
function ended(){ return heaps.every(h=>h===0); }
function setTurn(){ if(over)return; const el=document.getElementById('turn'); el.textContent=turn===0?'Your turn':'🤖 AI thinking…'; el.style.color=turn===0?'#f0c040':'#e05050'; }
function aiMove(){
  const mv=bestMove();
  heaps[mv.row]-=mv.count; busy=false; sfx('place');
  render();
  if(ended()) return finish();
  turn=0; setTurn();
}
function bestMove(){
  const nonEmpty=heaps.map((h,i)=>({h,i})).filter(o=>o.h>0);
  const ones=nonEmpty.filter(o=>o.h===1).length;
  const bigs=nonEmpty.filter(o=>o.h>1);
  if(misere){
    // misère strategy
    if(bigs.length===1){
      const b=bigs[0];
      // leave an odd number of 1-heaps
      const leave = (ones%2===0)? 1 : 0;
      return {row:b.i, count:b.h-leave};
    }
    // more than one big heap -> play normal nim
  }
  // normal nim: make nim-sum 0
  const x=heaps.reduce((a,b)=>a^b,0);
  if(x!==0){
    for(const o of nonEmpty){ const target=o.h^x; if(target<o.h) return {row:o.i, count:o.h-target}; }
  }
  // losing position (or forced): take 1 from the largest
  let big=nonEmpty.reduce((a,b)=>b.h>a.h?b:a);
  return {row:big.i, count:1};
}
function finish(){
  over=true;
  // the player who JUST took the last stick is 'turn' (we flip after). Determine winner.
  // afterMove/aiMove call finish() right after the mover emptied board, before flipping.
  const lastMover=turn; // 0 if player just moved, 1 if AI just moved
  const lastWins=!misere;
  const playerWon = lastWins ? (lastMover===0) : (lastMover===1);
  if(playerWon&&window.GH)GH.score.inc(GAME,'wins',1);
  document.getElementById('wins').textContent=(window.GH?GH.score.get(GAME,'wins'):0)||0;
  document.getElementById('win-msg').textContent=playerWon?'🏆 YOU WIN!':'🤖 AI WINS!';
  document.getElementById('win-sub').textContent=misere?'(whoever took the last stick loses)':'(whoever took the last stick wins)';
  setTimeout(()=>document.getElementById('win-overlay').classList.add('show'),300);
}
newGame();
</script>
</body>
</html>
