<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>2048</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="../themes/themes.css">
<script src="../themes/themes.js" defer></script>
<script src="../lang/lang.js" defer></script>
<style>
.g-wrap{display:flex;flex-direction:column;align-items:center;padding:16px;gap:14px;}
.g-board{
  display:grid;grid-template-columns:repeat(4,var(--t));grid-template-rows:repeat(4,var(--t));
  gap:10px;background:var(--surface);padding:10px;border-radius:12px;border:2px solid var(--border);
  touch-action:none;
}
:root{--t:min(96px,20vw);}
.tile{
  display:flex;align-items:center;justify-content:center;border-radius:8px;
  font-family:'Orbitron',monospace;font-weight:900;
  background:var(--surface2);transition:transform .1s;
}
.tile.pop{animation:pop .18s ease;}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.t2{background:#3a3a44;color:#eee;}      .t4{background:#4a4438;color:#eee;}
.t8{background:#c0762a;color:#fff;}      .t16{background:#d0692a;color:#fff;}
.t32{background:#e0562a;color:#fff;}     .t64{background:#e83a1a;color:#fff;}
.t128{background:#d4b12a;color:#fff;box-shadow:0 0 14px rgba(240,192,64,.35);}
.t256{background:#d8b520;color:#fff;box-shadow:0 0 18px rgba(240,192,64,.45);}
.t512{background:#dcb810;color:#fff;box-shadow:0 0 22px rgba(240,192,64,.55);}
.t1024{background:#e0bb08;color:#fff;box-shadow:0 0 26px rgba(240,192,64,.65);}
.t2048{background:#f0c040;color:#111;box-shadow:0 0 34px rgba(240,192,64,.9);}
.tbig{background:#111;color:#f0c040;border:2px solid #f0c040;}
</style>
</head>
<body>
<div class="hdr">
  <a class="back-btn" href="../index.html">← HUB</a>
  <span class="h-title" style="color:#f0c040">🔢 2048</span>
  <div class="h-btns">
    <div class="info-pill">SCORE: <span id="sc">0</span></div>
    <div class="info-pill">BEST: <span id="best">0</span></div>
    <button class="hbtn" onclick="undo()" id="undo-btn">↩ UNDO</button>
    <button class="hbtn" onclick="newGame()">NEW GAME</button>
  </div>
</div>

<div class="g-wrap">
  <div class="g-board" id="board"></div>
  <div style="font-family:'Orbitron',monospace;font-size:10px;color:var(--dim);letter-spacing:1px;">
    ARROWS / WASD / SWIPE — JOIN TILES TO REACH 2048
  </div>
</div>

<div id="win-overlay">
  <div class="win-msg" id="win-msg">🏆 2048!</div>
  <div class="win-sub" id="win-sub"></div>
  <div class="win-btns">
    <button class="win-btn" id="continue-btn" onclick="continueGame()" style="display:none;">KEEP GOING</button>
    <button class="win-btn" onclick="newGame()">NEW GAME</button>
    <button class="win-btn sec" onclick="location.href='../index.html'">← HUB</button>
  </div>
</div>

<script>
let grid=[],score=0,best=0,prev=null,won=false,over=false;
try{best=parseInt(localStorage.getItem('gamehub.2048.best'))||0;}catch(e){}
document.getElementById('best').textContent=best;

function newGame(){
  grid=Array(16).fill(0);score=0;prev=null;won=false;over=false;
  document.getElementById('sc').textContent=0;
  document.getElementById('win-overlay').classList.remove('show');
  addTile();addTile();render();
}

function addTile(){
  const empty=grid.map((v,i)=>v?-1:i).filter(i=>i>=0);
  if(!empty.length)return;
  grid[empty[0|Math.random()*empty.length]]=Math.random()<0.9?2:4;
}

function render(popped=[]){
  const b=document.getElementById('board');
  b.innerHTML='';
  grid.forEach((v,i)=>{
    const d=document.createElement('div');
    d.className='tile'+(v?(v<=2048?' t'+v:' tbig'):'')+(popped.includes(i)?' pop':'');
    d.textContent=v||'';
    d.style.fontSize=v>=1024?'calc(var(--t)*.3)':v>=128?'calc(var(--t)*.36)':'calc(var(--t)*.42)';
    b.appendChild(d);
  });
  document.getElementById('sc').textContent=score;
}

// Slide one row/col array toward index 0. Returns [newArr, gained, merged positions]
function slide(arr){
  const a=arr.filter(v=>v);
  let gained=0;
  const mergedAt=[];
  for(let i=0;i<a.length-1;i++){
    if(a[i]===a[i+1]){
      a[i]*=2;gained+=a[i];mergedAt.push(i);
      a.splice(i+1,1);
    }
  }
  while(a.length<4)a.push(0);
  return[a,gained,mergedAt];
}

function move(dx,dy){
  if(over)return;
  const before=grid.join(',');
  const saved={grid:[...grid],score};
  let gained=0;
  const popped=[];

  for(let line=0;line<4;line++){
    // collect indices of this line in slide order
    let idx=[];
    for(let k=0;k<4;k++){
      if(dx===1)idx.push(line*4+(3-k));
      else if(dx===-1)idx.push(line*4+k);
      else if(dy===1)idx.push((3-k)*4+line);
      else idx.push(k*4+line);
    }
    const vals=idx.map(i=>grid[i]);
    const[out,g,mergedAt]=slide(vals);
    gained+=g;
    idx.forEach((gi,k)=>{
      if(grid[gi]!==out[k]&&out[k])popped.push(gi);
      grid[gi]=out[k];
    });
  }

  if(grid.join(',')===before)return; // nothing moved
  prev=saved;
  score+=gained;
  if(score>best){best=score;document.getElementById('best').textContent=best;try{localStorage.setItem('gamehub.2048.best',best);}catch(e){}}
  addTile();
  render(popped);

  if(!won&&grid.includes(2048)){
    won=true;
    document.getElementById('win-msg').textContent='🏆 2048!';
    document.getElementById('win-sub').textContent='You made the tile! Score: '+score;
    document.getElementById('continue-btn').style.display='';
    document.getElementById('win-overlay').classList.add('show');
    return;
  }
  if(!canMove()){
    over=true;
    setTimeout(()=>{
      document.getElementById('win-msg').textContent='💀 GAME OVER';
      document.getElementById('win-sub').textContent='No more moves — Score: '+score;
      document.getElementById('continue-btn').style.display='none';
      document.getElementById('win-overlay').classList.add('show');
    },350);
  }
}

function canMove(){
  if(grid.includes(0))return true;
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    const v=grid[r*4+c];
    if(c<3&&grid[r*4+c+1]===v)return true;
    if(r<3&&grid[(r+1)*4+c]===v)return true;
  }
  return false;
}

function undo(){
  if(!prev||over)return;
  grid=[...prev.grid];score=prev.score;prev=null;
  render();
}

function continueGame(){
  document.getElementById('win-overlay').classList.remove('show');
}

document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a'){e.preventDefault();move(-1,0);}
  else if(k==='arrowright'||k==='d'){e.preventDefault();move(1,0);}
  else if(k==='arrowup'||k==='w'){e.preventDefault();move(0,-1);}
  else if(k==='arrowdown'||k==='s'){e.preventDefault();move(0,1);}
});

let ts=null;
const bEl=document.getElementById('board');
bEl.addEventListener('touchstart',e=>{ts={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
bEl.addEventListener('touchend',e=>{
  if(!ts)return;
  const dx=e.changedTouches[0].clientX-ts.x,dy=e.changedTouches[0].clientY-ts.y;
  if(Math.abs(dx)<26&&Math.abs(dy)<26)return;
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);
  else move(0,dy>0?1:-1);
  ts=null;
},{passive:true});

newGame();
</script>
</body>
</html>
