<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tower of Hanoi</title>
<link rel="stylesheet" href="shared.css">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="../themes/themes.css">
<script src="../themes/themes.js" defer></script>
<script src="../lang/lang.js" defer></script>
<style>
.th-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px 12px;}
.th-pegs{display:flex;gap:10px;width:100%;max-width:720px;justify-content:space-around;align-items:flex-end;}
.th-peg{position:relative;flex:1;height:240px;display:flex;flex-direction:column-reverse;align-items:center;cursor:pointer;border-radius:8px;transition:background .15s;padding-bottom:0;}
.th-peg:hover{background:rgba(240,192,64,.06);}
.th-peg.sel{background:rgba(240,192,64,.14);box-shadow:inset 0 0 0 2px var(--accent);}
.th-rod{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:10px;height:200px;background:linear-gradient(90deg,#4a3418,#6a4a24);border-radius:5px;}
.th-base{position:absolute;bottom:0;left:6%;right:6%;height:14px;background:linear-gradient(90deg,#3a2614,#5a3c20);border-radius:4px;}
.th-disk{position:relative;z-index:2;height:24px;border-radius:12px;border:2px solid rgba(255,255,255,.25);margin-bottom:3px;box-shadow:0 2px 5px rgba(0,0,0,.5);}
.th-hint{font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--dim);text-align:center;}
</style>
</head>
<body>
<div class="hdr">
  <a class="back-btn" href="../index.html">← HUB</a>
  <span class="h-title" style="color:#f0a040">🗼 TOWER OF HANOI</span>
  <div class="h-btns">
    <select id="disk-sel" onchange="newGame()">
      <option value="3">3 disks</option>
      <option value="4">4 disks</option>
      <option value="5" selected>5 disks</option>
      <option value="6">6 disks</option>
      <option value="7">7 disks</option>
    </select>
    <div class="info-pill">MOVES: <span id="moves">0</span></div>
    <div class="info-pill">MIN: <span id="min">0</span></div>
    <button class="hbtn" onclick="newGame()">NEW GAME</button>
  </div>
</div>
<div class="th-wrap">
  <div class="th-hint">Click a peg to pick up its top disk, click another to drop it. <b>Never put a big disk on a smaller one.</b> Move the whole tower to the right peg.</div>
  <div class="th-pegs" id="pegs"></div>
</div>
<div id="win-overlay">
  <div class="win-msg" id="win-msg">🏆 SOLVED!</div>
  <div class="win-sub" id="win-sub"></div>
  <div class="win-btns">
    <button class="win-btn" onclick="newGame()">PLAY AGAIN</button>
    <button class="win-btn sec" onclick="location.href='../index.html'">← HUB</button>
  </div>
</div>
<script>
const GAME='hanoi';
function sfx(n){try{if(window.GH)GH.sfx.play(n);}catch(e){}}
const DCOLORS=['#e05050','#f0a040','#f0c040','#40c0a0','#5090e0','#c080e0','#ff80b0'];
let n=5, pegs=[[],[],[]], sel=-1, moves=0, over=false;

function newGame(){
  n=parseInt(document.getElementById('disk-sel').value,10);
  pegs=[[],[],[]]; sel=-1; moves=0; over=false;
  for(let d=n;d>=1;d--) pegs[0].push(d); // bottom = n, top = 1
  document.getElementById('win-overlay').classList.remove('show');
  document.getElementById('min').textContent=(Math.pow(2,n)-1);
  render();
}
function clickPeg(i){
  if(over) return;
  if(sel===-1){
    if(!pegs[i].length){ sfx('error'); return; }
    sel=i; sfx('select'); render(); return;
  }
  if(sel===i){ sel=-1; render(); return; }
  const disk=pegs[sel][pegs[sel].length-1];
  const top=pegs[i][pegs[i].length-1];
  if(top && disk>top){ sfx('error'); sel=-1; render(); return; }
  pegs[i].push(pegs[sel].pop());
  sel=-1; moves++; sfx('place'); render();
  if(pegs[2].length===n){ win(); }
}
function win(){
  over=true;
  const min=Math.pow(2,n)-1;
  const perfect=moves===min;
  const r=window.GH?GH.score.best(GAME,'best_'+n,moves,'low'):{value:moves,isBest:false};
  document.getElementById('win-sub').textContent=moves+' moves (min '+min+')'+(perfect?' — PERFECT! ⭐':'')+(r.isBest?' · NEW BEST!':'');
  setTimeout(()=>document.getElementById('win-overlay').classList.add('show'),250);
}
function render(){
  const wrap=document.getElementById('pegs'); if(!wrap)return;
  wrap.innerHTML='';
  const maxW=Math.min(window.innerWidth-60,680)/3-14;
  for(let i=0;i<3;i++){
    const peg=document.createElement('div');
    peg.className='th-peg'+(sel===i?' sel':'');
    peg.onclick=()=>clickPeg(i);
    peg.innerHTML='<div class="th-base"></div><div class="th-rod"></div>';
    pegs[i].forEach(d=>{
      const el=document.createElement('div'); el.className='th-disk';
      el.style.width=(28+(d/n)*(maxW-28))+'px';
      el.style.background='linear-gradient(145deg,'+DCOLORS[(d-1)%DCOLORS.length]+',rgba(0,0,0,.25))';
      peg.appendChild(el);
    });
    wrap.appendChild(peg);
  }
  document.getElementById('moves').textContent=moves;
}
window.addEventListener('resize',()=>{ if(pegs) render(); });
newGame();
</script>
</body>
</html>
