<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simon</title>
<link rel="stylesheet" href="shared.css">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="../themes/themes.css">
<script src="../themes/themes.js" defer></script>
<script src="../lang/lang.js" defer></script>
<style>
.sm-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;padding:18px 12px;}
.sm-board{position:relative;width:min(340px,86vw);aspect-ratio:1/1;border-radius:50%;background:#111;border:6px solid #222;box-shadow:0 8px 30px rgba(0,0,0,.6);}
.sm-pad{position:absolute;width:50%;height:50%;cursor:pointer;opacity:.55;transition:opacity .1s,filter .1s;}
.sm-pad.lit{opacity:1;filter:brightness(1.8);}
.sm-g{top:0;left:0;background:#20aa44;border-radius:100% 0 0 0;}
.sm-r{top:0;right:0;background:#e03030;border-radius:0 100% 0 0;}
.sm-y{bottom:0;left:0;background:#e0c020;border-radius:0 0 0 100%;}
.sm-b{bottom:0;right:0;background:#2070e0;border-radius:0 0 100% 0;}
.sm-center{position:absolute;top:28%;left:28%;width:44%;height:44%;border-radius:50%;background:var(--surface);border:5px solid #222;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Orbitron',monospace;}
.sm-center .r{font-size:30px;font-weight:900;color:var(--accent);}
.sm-center .l{font-size:9px;color:var(--dim);letter-spacing:2px;}
.sm-hint{font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--dim);text-align:center;min-height:20px;}
.sm-start{font-family:'Orbitron',monospace;font-size:15px;font-weight:700;padding:13px 28px;border-radius:10px;border:3px solid var(--green);color:var(--green);background:var(--surface);cursor:pointer;letter-spacing:2px;}
.sm-start:hover{background:rgba(64,192,160,.15);}
</style>
</head>
<body>
<div class="hdr">
  <a class="back-btn" href="../index.html">← HUB</a>
  <span class="h-title" style="color:#40c0a0">🎵 SIMON</span>
  <div class="h-btns">
    <select id="mode-sel" onchange="reset()">
      <option value="normal" selected>NORMAL</option>
      <option value="strict">STRICT</option>
    </select>
    <div class="info-pill">BEST: <span id="best">0</span></div>
  </div>
</div>
<div class="sm-wrap">
  <div class="sm-board" id="board">
    <div class="sm-pad sm-g" data-k="0"></div>
    <div class="sm-pad sm-r" data-k="1"></div>
    <div class="sm-pad sm-y" data-k="2"></div>
    <div class="sm-pad sm-b" data-k="3"></div>
    <div class="sm-center"><div class="r" id="round">—</div><div class="l">ROUND</div></div>
  </div>
  <div class="sm-hint" id="hint">Repeat the sequence of colours.</div>
  <button class="sm-start" id="start-btn" onclick="startGame()">▶ START</button>
</div>
<div id="win-overlay">
  <div class="win-msg" id="win-msg">💥 WRONG!</div>
  <div class="win-sub" id="win-sub"></div>
  <div class="win-btns">
    <button class="win-btn" onclick="startGame()">PLAY AGAIN</button>
    <button class="win-btn sec" onclick="location.href='../index.html'">← HUB</button>
  </div>
</div>
<script>
const GAME='simon';
const FREQ=[329.6,261.6,392.0,220.0]; // G R Y B pads
let seq=[], step=0, playing=false, acceptInput=false, best, strict=false;
best=(window.GH?GH.score.get(GAME,'best'):0)||0;
document.getElementById('best').textContent=best;
const pads=[...document.querySelectorAll('.sm-pad')];

function tone(i,dur){
  try{
    if(window.GH&&GH.sfx.isMuted())return;
    const AC=window.__ac||(window.__ac=new (window.AudioContext||window.webkitAudioContext)());
    if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type='sine';o.frequency.value=FREQ[i];
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.02);
  }catch(e){}
}
function light(i,dur){ pads[i].classList.add('lit'); tone(i,dur/1000); setTimeout(()=>pads[i].classList.remove('lit'),dur); }

function reset(){
  seq=[]; step=0; playing=false; acceptInput=false;
  strict=document.getElementById('mode-sel').value==='strict';
  document.getElementById('round').textContent='—';
  document.getElementById('hint').textContent='Repeat the sequence of colours.';
  document.getElementById('win-overlay').classList.remove('show');
  document.getElementById('start-btn').style.display='';
}
function startGame(){
  reset();
  document.getElementById('start-btn').style.display='none';
  nextRound();
}
function nextRound(){
  seq.push(0|Math.random()*4); step=0;
  document.getElementById('round').textContent=seq.length;
  document.getElementById('hint').textContent='Watch…';
  playback();
}
function playback(){
  acceptInput=false; playing=true;
  let i=0;
  const iv=setInterval(()=>{
    if(i>=seq.length){ clearInterval(iv); playing=false; acceptInput=true; document.getElementById('hint').textContent='Your turn!'; return; }
    light(seq[i],420); i++;
  }, 650);
}
function press(i){
  if(!acceptInput) return;
  light(i,250);
  if(seq[step]===i){
    step++;
    if(step===seq.length){ acceptInput=false; setTimeout(nextRound,700); }
  } else {
    wrong();
  }
}
function wrong(){
  acceptInput=false;
  try{if(window.GH)GH.sfx.play('error');}catch(e){}
  if(strict){ return gameOver(); }
  // normal: replay same round
  document.getElementById('hint').textContent='Oops — watch again…';
  setTimeout(()=>{ step=0; playback(); }, 900);
}
function gameOver(){
  const reached=seq.length-1;
  const r=window.GH?GH.score.best(GAME,'best',reached,'high'):{value:reached,isBest:false}; best=r.value;
  document.getElementById('best').textContent=best;
  document.getElementById('win-sub').textContent='Reached round '+reached+(r.isBest&&reached>0?' — NEW BEST! 🎉':' · Best '+best);
  document.getElementById('start-btn').style.display='';
  setTimeout(()=>document.getElementById('win-overlay').classList.add('show'),250);
}
pads.forEach((p,i)=>{ p.addEventListener('click',()=>press(i)); });
</script>
</body>
</html>
