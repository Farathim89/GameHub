<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Checkers</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="../themes/themes.css">
<script src="../themes/themes.js" defer></script>
<script src="../lang/lang.js" defer></script>
<style>
.ck-wrap{display:flex;flex-direction:column;align-items:center;padding:12px;gap:10px;}
:root{--ck:min(60px,11vw);}
.ck-board{display:grid;grid-template-columns:repeat(8,var(--ck));border:3px solid #6a4a2a;border-radius:4px;overflow:hidden;}
.cksq{width:var(--ck);height:var(--ck);display:flex;align-items:center;justify-content:center;position:relative;}
.cksq.light{background:#e8d0a8;}
.cksq.dark{background:#9a6a3a;cursor:pointer;}
.cksq.sel{box-shadow:inset 0 0 0 4px #f0c040;}
.cksq.hint::after{content:'';position:absolute;width:30%;height:30%;background:rgba(255,255,255,.35);border-radius:50%;}
.ckp{width:78%;height:78%;border-radius:50%;border:3px solid rgba(0,0,0,.35);
  box-shadow:inset 0 -4px 6px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;font-size:calc(var(--ck)*.4);}
.ckp.r{background:radial-gradient(circle at 35% 30%,#f06060,#a01818 75%);}
.ckp.b{background:radial-gradient(circle at 35% 30%,#555,#111 75%);}
.ckp.king::after{content:'♛';color:#f0c040;text-shadow:0 1px 3px rgba(0,0,0,.8);}
.score-bar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center;}
.turn-pill{font-family:'Orbitron',monospace;font-size:14px;font-weight:700;padding:8px 18px;border-radius:8px;border:2px solid;letter-spacing:2px;}
</style>
</head>
<body>
<div class="hdr">
  <a class="back-btn" href="../index.html">← HUB</a>
  <span class="h-title" style="color:#e05050">🔴 CHECKERS</span>
  <div class="h-btns">
    <select id="mode-sel" onchange="newGame()">
      <option value="2p">2 PLAYERS</option>
      <option value="ai-easy">VS AI (Easy)</option>
      <option value="ai-hard" selected>VS AI (Hard)</option>
    </select>
    <button class="hbtn" onclick="newGame()">NEW GAME</button>
  </div>
</div>

<div class="ck-wrap">
  <div class="score-bar">
    <div class="info-pill">🔴 <span id="cnt-r">12</span></div>
    <div class="turn-pill" id="turn-pill">🔴 RED'S TURN</div>
    <div class="info-pill">⚫ <span id="cnt-b">12</span></div>
  </div>
  <div class="ck-board" id="board"></div>
  <div style="font-family:'Orbitron',monospace;font-size:10px;color:var(--dim);letter-spacing:1px;">CAPTURES ARE FORCED · REACH THE FAR SIDE TO CROWN A KING</div>
</div>

<div id="win-overlay">
  <div class="win-msg" id="win-msg">GAME OVER</div>
  <div class="win-sub" id="win-sub"></div>
  <div class="win-btns">
    <button class="win-btn" onclick="newGame()">PLAY AGAIN</button>
    <button class="win-btn sec" onclick="location.href='../index.html'">← HUB</button>
  </div>
</div>

<script>
// board: 64 cells, null | {c:'r'|'b', k:bool}. Red moves UP (-1), black DOWN (+1). Human = red.
let bd=[],turn='r',mode='ai-hard',sel=-1,selMoves=[],over=false,chainSq=-1;

function newGame(){
  mode=document.getElementById('mode-sel').value;
  bd=Array(64).fill(null);
  for(let r=0;r<3;r++)for(let c=0;c<8;c++)if((r+c)%2===1)bd[r*8+c]={c:'b',k:false};
  for(let r=5;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2===1)bd[r*8+c]={c:'r',k:false};
  turn='r';sel=-1;selMoves=[];over=false;chainSq=-1;
  document.getElementById('win-overlay').classList.remove('show');
  render();
}

// moves for one piece on a given board: [{to, cap}] — cap = captured square or -1
function pieceMoves(board,sq){
  const p=board[sq];if(!p)return[];
  const r=sq>>3,c=sq&7;
  const dirs=p.k?[[-1,-1],[-1,1],[1,-1],[1,1]]:(p.c==='r'?[[-1,-1],[-1,1]]:[[1,-1],[1,1]]);
  const steps=[],jumps=[];
  for(const[dr,dc]of dirs){
    const nr=r+dr,nc=c+dc;
    if(nr<0||nr>7||nc<0||nc>7)continue;
    const nq=nr*8+nc;
    if(!board[nq])steps.push({to:nq,cap:-1});
    else if(board[nq].c!==p.c){
      const jr=nr+dr,jc=nc+dc;
      if(jr>=0&&jr<8&&jc>=0&&jc<8&&!board[jr*8+jc])jumps.push({to:jr*8+jc,cap:nq});
    }
  }
  return{steps,jumps};
}

// all legal moves for color (captures forced): [{from,to,cap}]
function allMoves(board,color){
  const steps=[],jumps=[];
  for(let sq=0;sq<64;sq++){
    if(board[sq]&&board[sq].c===color){
      const m=pieceMoves(board,sq);
      m.steps.forEach(x=>steps.push({from:sq,...x}));
      m.jumps.forEach(x=>jumps.push({from:sq,...x}));
    }
  }
  return jumps.length?jumps:steps;
}

function applyMv(board,mv){
  const b2=board.map(p=>p?{...p}:null);
  const p=b2[mv.from];
  b2[mv.to]=p;b2[mv.from]=null;
  if(mv.cap>=0)b2[mv.cap]=null;
  // crown
  const r=mv.to>>3;
  let crowned=false;
  if(!p.k&&((p.c==='r'&&r===0)||(p.c==='b'&&r===7))){p.k=true;crowned=true;}
  return{b2,crowned};
}

function clickSq(sq){
  if(over)return;
  if(mode!=='2p'&&turn==='b')return;
  const legal=allMoves(bd,turn);

  // continuing a multi-jump: only that piece may move
  const src=chainSq>=0?chainSq:null;

  // clicked a destination?
  if(sel>=0){
    const mv=selMoves.find(m=>m.to===sq);
    if(mv){doMove(mv);return;}
  }
  // select own piece
  if(bd[sq]&&bd[sq].c===turn&&(src===null||sq===src)){
    const mine=legal.filter(m=>m.from===sq);
    if(mine.length){sel=sq;selMoves=mine;render();return;}
  }
  if(src===null){sel=-1;selMoves=[];render();}
}

function doMove(mv){
  const wasJump=mv.cap>=0;
  const{b2,crowned}=applyMv(bd,mv);
  bd=b2;
  sel=-1;selMoves=[];

  // multi-jump: same piece must continue jumping (unless just crowned)
  if(wasJump&&!crowned){
    const more=pieceMoves(bd,mv.to).jumps;
    if(more.length){
      chainSq=mv.to;
      sel=mv.to;selMoves=more.map(x=>({from:mv.to,...x}));
      render();
      if(mode!=='2p'&&turn==='b')setTimeout(()=>doMove(selMoves[0|Math.random()*selMoves.length]),400);
      return;
    }
  }
  chainSq=-1;
  turn=turn==='r'?'b':'r';
  render();
  checkEnd();
  if(!over&&mode!=='2p'&&turn==='b')setTimeout(aiMove,500);
}

function checkEnd(){
  const moves=allMoves(bd,turn);
  const rc=bd.filter(p=>p&&p.c==='r').length,bc=bd.filter(p=>p&&p.c==='b').length;
  if(!moves.length||!rc||!bc){
    over=true;
    const redLost=!rc||(turn==='r'&&!moves.length);
    const msg=redLost?(mode!=='2p'?'🤖 AI WINS!':'⚫ BLACK WINS!'):(mode!=='2p'?'🏆 YOU WIN!':'🔴 RED WINS!');
    document.getElementById('win-msg').textContent=msg;
    document.getElementById('win-sub').textContent=`🔴 ${rc} — ⚫ ${bc}`;
    setTimeout(()=>document.getElementById('win-overlay').classList.add('show'),400);
  }
}

function render(){
  const b=document.getElementById('board');b.innerHTML='';
  for(let sq=0;sq<64;sq++){
    const r=sq>>3,c=sq&7;
    const d=document.createElement('div');
    d.className='cksq '+((r+c)%2===0?'light':'dark');
    if(sq===sel)d.classList.add('sel');
    if(selMoves.some(m=>m.to===sq))d.classList.add('hint');
    if(bd[sq]){
      const p=document.createElement('div');
      p.className='ckp '+bd[sq].c+(bd[sq].k?' king':'');
      d.appendChild(p);
    }
    d.onclick=()=>clickSq(sq);
    b.appendChild(d);
  }
  document.getElementById('cnt-r').textContent=bd.filter(p=>p&&p.c==='r').length;
  document.getElementById('cnt-b').textContent=bd.filter(p=>p&&p.c==='b').length;
  const tp=document.getElementById('turn-pill');
  tp.textContent=turn==='r'?'🔴 RED\'S TURN':(mode!=='2p'?'🤖 AI\'S TURN':'⚫ BLACK\'S TURN');
  tp.style.color=turn==='r'?'#f06060':'#aaa';
  tp.style.borderColor=turn==='r'?'#f06060':'#666';
}

// ── AI (black) ──
function evalBd(board){
  let s=0;
  for(let sq=0;sq<64;sq++){
    const p=board[sq];if(!p)continue;
    const r=sq>>3;
    let v=p.k?170:100;
    // advancement bonus for men
    if(!p.k)v+=p.c==='b'?r*3:(7-r)*3;
    // edge safety small bonus
    const c=sq&7;
    if(c===0||c===7)v+=2;
    s+=p.c==='b'?v:-v;
  }
  return s;
}

// full move = sequence of jumps resolved greedily inside search (single-step approximation with continuation)
function search(board,color,depth,alpha,beta){
  const moves=allMoves(board,color);
  if(!moves.length)return color==='b'?-100000:100000;
  if(depth===0)return evalBd(board);
  const maxing=color==='b';
  let best=maxing?-Infinity:Infinity;
  for(const mv of moves){
    const{b2,crowned}=applyMv(board,mv);
    let v;
    // continue multi-jump with same color if available
    if(mv.cap>=0&&!crowned&&pieceMoves(b2,mv.to).jumps.length){
      v=searchChain(b2,mv.to,color,depth,alpha,beta);
    } else {
      v=search(b2,color==='r'?'b':'r',depth-1,alpha,beta);
    }
    if(maxing){best=Math.max(best,v);alpha=Math.max(alpha,v);}
    else{best=Math.min(best,v);beta=Math.min(beta,v);}
    if(beta<=alpha)break;
  }
  return best;
}
function searchChain(board,sq,color,depth,alpha,beta){
  const jumps=pieceMoves(board,sq).jumps;
  const maxing=color==='b';
  let best=maxing?-Infinity:Infinity;
  for(const j of jumps){
    const mv={from:sq,...j};
    const{b2,crowned}=applyMv(board,mv);
    let v;
    if(!crowned&&pieceMoves(b2,mv.to).jumps.length)v=searchChain(b2,mv.to,color,depth,alpha,beta);
    else v=search(b2,color==='r'?'b':'r',depth-1,alpha,beta);
    if(maxing)best=Math.max(best,v);else best=Math.min(best,v);
  }
  return best;
}

function aiMove(){
  if(over||turn!=='b')return;
  const moves=allMoves(bd,'b');
  if(!moves.length){checkEnd();return;}
  const depth=mode==='ai-easy'?2:6;
  // shuffle for variety
  for(let i=moves.length-1;i>0;i--){const j=0|Math.random()*(i+1);[moves[i],moves[j]]=[moves[j],moves[i]];}
  let bestV=-Infinity,bestMv=moves[0];
  for(const mv of moves){
    const{b2,crowned}=applyMv(bd,mv);
    let v;
    if(mv.cap>=0&&!crowned&&pieceMoves(b2,mv.to).jumps.length)v=searchChain(b2,mv.to,'b',depth,-Infinity,Infinity);
    else v=search(b2,'r',depth-1,-Infinity,Infinity);
    if(v>bestV){bestV=v;bestMv=mv;}
  }
  doMove(bestMv);
}

newGame();
</script>
</body>
</html>
