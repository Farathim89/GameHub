<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Binairo</title>
<link rel="stylesheet" href="shared.css">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="../themes/themes.css">
<script src="../themes/themes.js" defer></script>
<script src="../lang/lang.js" defer></script>
<style>
.bn-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 12px;}
.bn-grid{display:grid;gap:3px;background:var(--surface);padding:8px;border-radius:12px;border:2px solid var(--border);}
.bn-cell{display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-weight:900;border-radius:7px;cursor:pointer;transition:transform .08s;}
.bn-cell:active{transform:scale(.92);}
.bn-cell.v0{background:linear-gradient(145deg,#2a3650,#1a2438);color:#8ab0e0;}
.bn-cell.v1{background:linear-gradient(145deg,#f0a040,#c07010);color:#fff;}
.bn-cell.empty{background:var(--surface2);color:transparent;}
.bn-cell.given{cursor:default;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);}
.bn-cell.err{outline:2px solid var(--red);}
.bn-hint{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--dim);text-align:center;max-width:460px;line-height:1.6;}
</style>
</head>
<body>
<div class="hdr">
  <a class="back-btn" href="../index.html">← HUB</a>
  <span class="h-title" style="color:#f0a040">◐ BINAIRO</span>
  <div class="h-btns">
    <select id="size-sel" onchange="newGame()">
      <option value="6" selected>6×6</option>
      <option value="8">8×8</option>
      <option value="10">10×10</option>
    </select>
    <button class="hbtn" onclick="newGame()">NEW GAME</button>
  </div>
</div>
<div class="bn-wrap">
  <div class="bn-hint">Fill every cell with ● or ●. No three in a row, equal counts per line, and no two lines alike. Tap to cycle.</div>
  <div id="grid" class="bn-grid"></div>
</div>
<div id="win-overlay">
  <div class="win-msg" id="win-msg">🏆 SOLVED!</div>
  <div class="win-sub" id="win-sub"></div>
  <div class="win-btns">
    <button class="win-btn" onclick="newGame()">PLAY AGAIN</button>
    <button class="win-btn sec" onclick="location.href='../index.html'">← HUB</button>
  </div>
</div>
<script>
const GAME='binairo';
function sfx(n){try{if(window.GH)GH.sfx.play(n);}catch(e){}}
let N=6, grid=[], given=[], sol=[], over=false;
function newGame(){
  N=parseInt(document.getElementById('size-sel').value,10); over=false;
  document.getElementById('win-overlay').classList.remove('show');
  let ok=false;
  for(let t=0;t<200&&!ok;t++){ sol=genSolution(); if(sol&&uniqueLines(sol)) ok=true; }
  if(!ok) sol=genSolution();
  // reveal givens
  grid=Array.from({length:N},()=>Array(N).fill(-1));
  given=Array.from({length:N},()=>Array(N).fill(false));
  const reveal=Math.round(N*N*0.55);
  const cells=[]; for(let r=0;r<N;r++)for(let c=0;c<N;c++)cells.push([r,c]);
  for(let i=cells.length-1;i>0;i--){const j=0|Math.random()*(i+1);[cells[i],cells[j]]=[cells[j],cells[i]];}
  for(let i=0;i<reveal;i++){ const [r,c]=cells[i]; grid[r][c]=sol[r][c]; given[r][c]=true; }
  render();
}
function genSolution(){
  const g=Array.from({length:N},()=>Array(N).fill(-1));
  function ok(r,c,v){
    // no 3 in a row horizontally
    if(c>=2&&g[r][c-1]===v&&g[r][c-2]===v)return false;
    if(c>=1&&c<N-1&&g[r][c-1]===v&&g[r][c+1]===v)return false; // not applicable (c+1 unset) - skip
    if(r>=2&&g[r-1][c]===v&&g[r-2][c]===v)return false;
    // count per row/col <= N/2
    let rc=0; for(let k=0;k<N;k++)if(g[r][k]===v)rc++; if(rc>=N/2)return false;
    let cc=0; for(let k=0;k<N;k++)if(g[k][c]===v)cc++; if(cc>=N/2)return false;
    return true;
  }
  function solve(pos){
    if(pos===N*N)return true;
    const r=(pos/N)|0, c=pos%N;
    const vals=Math.random()<0.5?[0,1]:[1,0];
    for(const v of vals){ if(ok(r,c,v)){ g[r][c]=v; if(solve(pos+1))return true; g[r][c]=-1; } }
    return false;
  }
  return solve(0)?g:null;
}
function uniqueLines(g){
  const rows=g.map(r=>r.join('')); if(new Set(rows).size!==N)return false;
  const cols=[]; for(let c=0;c<N;c++){let s='';for(let r=0;r<N;r++)s+=g[r][c];cols.push(s);} if(new Set(cols).size!==N)return false;
  return true;
}
function cycle(r,c){
  if(over||given[r][c])return;
  grid[r][c]= grid[r][c]===-1?0 : grid[r][c]===0?1 : -1;
  sfx('select'); render();
  if(checkWin()) win();
}
function violations(){
  const bad=new Set();
  const mark=(r,c)=>bad.add(r+','+c);
  // 3-in-a-row
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){ const v=grid[r][c]; if(v<0)continue;
    if(c>=2&&grid[r][c-1]===v&&grid[r][c-2]===v){mark(r,c);mark(r,c-1);mark(r,c-2);}
    if(r>=2&&grid[r-1][c]===v&&grid[r-2][c]===v){mark(r,c);mark(r-1,c);mark(r-2,c);}
  }
  return bad;
}
function checkWin(){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(grid[r][c]<0)return false;
  for(let r=0;r<N;r++){ let z=0; for(let c=0;c<N;c++){ z+=grid[r][c]===0?1:0; if(c>=2&&grid[r][c]===grid[r][c-1]&&grid[r][c]===grid[r][c-2])return false; } if(z!==N/2)return false; }
  for(let c=0;c<N;c++){ let z=0; for(let r=0;r<N;r++){ z+=grid[r][c]===0?1:0; if(r>=2&&grid[r][c]===grid[r-1][c]&&grid[r][c]===grid[r-2][c])return false; } if(z!==N/2)return false; }
  return uniqueLines(grid);
}
function render(){
  const g=document.getElementById('grid'); if(!g)return;
  const cell=Math.floor(Math.min(window.innerWidth-40,420)/N);
  g.style.gridTemplateColumns=`repeat(${N},${cell}px)`;
  g.innerHTML='';
  const bad=violations();
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const v=grid[r][c];
    const d=document.createElement('div');
    d.className='bn-cell '+(v===0?'v0':v===1?'v1':'empty')+(given[r][c]?' given':'')+(bad.has(r+','+c)?' err':'');
    d.style.width=cell+'px'; d.style.height=cell+'px'; d.style.fontSize=(cell*0.5)+'px';
    d.textContent=v<0?'':'●';
    if(!given[r][c]) d.onclick=()=>cycle(r,c);
    g.appendChild(d);
  }
}
function win(){ over=true; if(window.GH)GH.score.inc(GAME,'wins',1); document.getElementById('win-sub').textContent='Perfectly balanced! 🎉'; setTimeout(()=>document.getElementById('win-overlay').classList.add('show'),300); }
window.addEventListener('resize',()=>{ if(grid.length) render(); });
newGame();
</script>
</body>
</html>
