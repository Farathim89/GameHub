<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order and Chaos</title>
<link rel="stylesheet" href="shared.css">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="../themes/themes.css">
<script src="../themes/themes.js" defer></script>
<script src="../lang/lang.js" defer></script>
<style>
.oc-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 12px;}
.oc-board{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;background:var(--surface);padding:8px;border-radius:12px;border:2px solid var(--border);}
.oc-cell{width:52px;height:52px;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-weight:900;font-size:30px;cursor:pointer;transition:background .12s;}
.oc-cell.playable:hover{background:var(--surface3);}
.oc-cell.x{color:#f0c040;} .oc-cell.o{color:#5090e0;}
.oc-pick{display:flex;gap:10px;align-items:center;}
.oc-sym{width:48px;height:48px;border-radius:10px;border:3px solid var(--border);background:var(--surface);font-family:'Orbitron',monospace;font-weight:900;font-size:26px;cursor:pointer;}
.oc-sym.sel{border-color:var(--accent);}
.oc-status{font-family:'Orbitron',monospace;font-size:14px;font-weight:700;min-height:20px;}
.oc-hint{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--dim);text-align:center;max-width:440px;line-height:1.6;}
@media(max-width:420px){.oc-cell{width:44px;height:44px;font-size:24px;}}
</style>
</head>
<body>
<div class="hdr">
  <a class="back-btn" href="../index.html">← HUB</a>
  <span class="h-title" style="color:#34d399">❎ ORDER &amp; CHAOS</span>
  <div class="h-btns"><select id="role-sel" onchange="newGame()"><option value="order" selected>YOU = ORDER</option><option value="chaos">YOU = CHAOS</option></select><button class="hbtn" onclick="newGame()">NEW GAME</button></div>
</div>
<div class="oc-wrap">
  <div class="oc-status" id="status">Your move</div>
  <div class="oc-pick"><span style="font-family:Orbitron;font-size:11px;color:var(--dim)">PLACE:</span><div class="oc-sym sel" id="symX" onclick="pickSym('X')">X</div><div class="oc-sym" id="symO" onclick="pickSym('O')">O</div></div>
  <div class="oc-board" id="board"></div>
  <div class="oc-hint"><b>Order</b> wins by making <b>5 in a row</b> (of X <i>or</i> O). <b>Chaos</b> wins by filling the board with no 5-in-a-row. Pick a symbol, then a cell.</div>
</div>
<div id="win-overlay">
  <div class="win-msg" id="win-msg">🏆 WIN!</div>
  <div class="win-sub" id="win-sub"></div>
  <div class="win-btns"><button class="win-btn" onclick="newGame()">PLAY AGAIN</button><button class="win-btn sec" onclick="location.href='../index.html'">← HUB</button></div>
</div>
<script>
const GAME='orderchaos';
function sfx(n){try{if(window.GH)GH.sfx.play(n);}catch(e){}}
const N=6; let bd=[], sym='X', youOrder=true, turn='order', over=false, busy=false;
function newGame(){ youOrder=document.getElementById('role-sel').value==='order'; bd=Array(N*N).fill(''); sym='X'; turn='order'; over=false; busy=false; pickSym('X');
  document.getElementById('win-overlay').classList.remove('show'); render(); status();
  if(!youOrder){ busy=true; setTimeout(aiMove,400); } }
function pickSym(s){ sym=s; document.getElementById('symX').classList.toggle('sel',s==='X'); document.getElementById('symO').classList.toggle('sel',s==='O'); }
function myTurn(){ return (turn==='order')===youOrder; }
function click(i){ if(over||busy||bd[i]||!myTurn())return; doMove(i,sym); }
function doMove(i,s){ bd[i]=s; sfx('place'); render();
  if(fiveInRow()){ return endGame('order'); }
  if(bd.every(v=>v)){ return endGame('chaos'); }
  turn=turn==='order'?'chaos':'order'; status();
  if(!myTurn()&&!over){ busy=true; setTimeout(aiMove,400); }
}
function fiveInRow(){ const dirs=[[0,1],[1,0],[1,1],[1,-1]]; for(let r=0;r<N;r++)for(let c=0;c<N;c++){ const v=bd[r*N+c]; if(!v)continue; for(const [dr,dc] of dirs){ let n=1; for(let s=1;s<5;s++){const rr=r+dr*s,cc=c+dc*s;if(rr>=0&&rr<N&&cc>=0&&cc<N&&bd[rr*N+cc]===v)n++;else break;} if(n>=5)return true; } } return false; }
function aiMove(){ if(over)return; const amOrder=turn==='order'; const empties=[]; for(let i=0;i<N*N;i++)if(!bd[i])empties.push(i);
  let move=null;
  if(amOrder){ // find winning move; else build longest line
    for(const i of empties)for(const s of ['X','O']){ bd[i]=s; if(fiveInRow()){bd[i]='';move={i,s};break;} bd[i]=''; } if(move){} else { // heuristic: place to extend
      let bv=-1; for(const i of empties)for(const s of ['X','O']){ bd[i]=s; const sc=lineScore(); bd[i]=''; if(sc>bv){bv=sc;move={i,s};} } }
  } else { // chaos: avoid giving order a 5; prefer move that breaks lines. pick symbol+cell minimizing max line for either symbol, and never complete 5
    let bv=1e9; for(const i of empties)for(const s of ['X','O']){ bd[i]=s; const makes5=fiveInRow(); const sc=makes5?1e9:lineScore(); bd[i]=''; if(sc<bv){bv=sc;move={i,s};} }
  }
  if(!move){ move={i:empties[0],s:'X'}; }
  busy=false; doMove(move.i,move.s);
}
function lineScore(){ // max consecutive same-symbol run on board
  const dirs=[[0,1],[1,0],[1,1],[1,-1]]; let best=0; for(let r=0;r<N;r++)for(let c=0;c<N;c++){ const v=bd[r*N+c]; if(!v)continue; for(const [dr,dc] of dirs){ let n=1; for(let s=1;s<5;s++){const rr=r+dr*s,cc=c+dc*s;if(rr>=0&&rr<N&&cc>=0&&cc<N&&bd[rr*N+cc]===v)n++;else break;} best=Math.max(best,n); } } return best; }
function render(){ const b=document.getElementById('board'); b.innerHTML=''; for(let i=0;i<N*N;i++){ const d=document.createElement('div'); const v=bd[i]; d.className='oc-cell'+(v==='X'?' x':v==='O'?' o':'')+((!v&&myTurn()&&!over&&!busy)?' playable':''); d.textContent=v; d.onclick=()=>click(i); b.appendChild(d); } }
function status(){ if(over)return; const el=document.getElementById('status'); const who=turn; el.textContent=busy?'🤖 AI ('+(who)+') thinking…':(myTurn()?'Your move as '+(youOrder?'ORDER':'CHAOS'):'AI\'s move'); }
function endGame(winner){ over=true; busy=false; const youWin=(winner==='order')===youOrder; if(youWin&&window.GH)GH.score.inc(GAME,'wins',1);
  document.getElementById('win-msg').textContent=youWin?'🏆 YOU WIN!':'🤖 AI WINS!'; document.getElementById('win-sub').textContent=(winner==='order'?'Order made 5 in a row!':'Chaos filled the board!'); setTimeout(()=>document.getElementById('win-overlay').classList.add('show'),350); }
newGame();
</script>
</body>
</html>
