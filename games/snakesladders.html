<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snakes & Ladders</title>
<link rel="stylesheet" href="shared.css">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="../themes/themes.css">
<script src="../themes/themes.js" defer></script>
<script src="../lang/lang.js" defer></script>
<style>
.sl-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 10px;}
#board{position:relative;background:var(--surface);border:3px solid var(--border);border-radius:10px;}
.sl-cell{position:absolute;box-sizing:border-box;display:flex;align-items:flex-start;justify-content:flex-start;font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--dim);padding:2px;border:1px solid rgba(255,255,255,.05);}
.sl-tok{position:absolute;width:20px;height:20px;border-radius:50%;border:2px solid #fff;transition:left .25s,top .25s;z-index:5;box-shadow:0 2px 5px rgba(0,0,0,.5);}
.sl-controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;}
.sl-die{width:58px;height:58px;border-radius:12px;background:var(--surface2);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;font-family:'Orbitron',monospace;color:var(--accent);}
.sl-roll{font-family:'Orbitron',monospace;font-size:15px;font-weight:700;padding:14px 28px;border-radius:10px;border:3px solid var(--green);color:var(--green);background:var(--surface);cursor:pointer;letter-spacing:2px;}
.sl-roll:disabled{opacity:.4;cursor:default;}
.sl-msg{font-family:'Orbitron',monospace;font-size:14px;min-height:22px;letter-spacing:1px;text-align:center;}
.sl-leg{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--dim);text-align:center;}
</style>
</head>
<body>
<div class="hdr">
  <a class="back-btn" href="../index.html">← HUB</a>
  <span class="h-title" style="color:#40c0a0">🐍 SNAKES &amp; LADDERS</span>
  <div class="h-btns">
    <select id="mode-sel" onchange="newGame()">
      <option value="2p">2 PLAYERS</option>
      <option value="ai" selected>VS AI</option>
    </select>
    <button class="hbtn" onclick="newGame()">NEW GAME</button>
  </div>
</div>
<div class="sl-wrap">
  <div class="sl-msg" id="msg">Your roll!</div>
  <div id="board"></div>
  <div class="sl-controls">
    <div class="sl-die" id="die">🎲</div>
    <button class="sl-roll" id="roll" onclick="roll()">🎲 ROLL</button>
  </div>
  <div class="sl-leg">🪜 ladders lift you up · 🐍 snakes slide you down · land exactly on 100 to win</div>
</div>
<div id="win-overlay">
  <div class="win-msg" id="win-msg">🏆 YOU WIN!</div>
  <div class="win-sub" id="win-sub"></div>
  <div class="win-btns">
    <button class="win-btn" onclick="newGame()">PLAY AGAIN</button>
    <button class="win-btn sec" onclick="location.href='../index.html'">← HUB</button>
  </div>
</div>
<script>
const GAME='snakesladders';
function sfx(n){try{if(window.GH)GH.sfx.play(n);}catch(e){}}
const JUMPS={ 4:14, 9:31, 20:38, 28:84, 40:59, 51:67, 63:81, 71:91,   17:7, 54:34, 62:19, 64:60, 87:24, 93:73, 95:75, 98:79 };
let pos=[0,0], turn=0, mode='ai', over=false, busy=false, cell=0;
function newGame(){
  mode=document.getElementById('mode-sel').value;
  pos=[0,0]; turn=0; over=false; busy=false;
  document.getElementById('win-overlay').classList.remove('show');
  document.getElementById('die').textContent='🎲';
  buildBoard(); render(); setMsg(turnName()+' — roll!');
  document.getElementById('roll').disabled=false;
}
function cellXY(n){ // n 1..100, boustrophedon from bottom-left
  const row=Math.floor((n-1)/10), col0=(n-1)%10;
  const col = row%2===0 ? col0 : 9-col0;
  const x=col*cell, y=(9-row)*cell;
  return [x,y];
}
function buildBoard(){
  const board=document.getElementById('board');
  const size=Math.min(window.innerWidth-40, 440); cell=Math.floor(size/10);
  board.style.width=cell*10+'px'; board.style.height=cell*10+'px';
  board.innerHTML='';
  for(let n=1;n<=100;n++){ const [x,y]=cellXY(n); const d=document.createElement('div'); d.className='sl-cell';
    d.style.cssText+=`left:${x}px;top:${y}px;width:${cell}px;height:${cell}px;`;
    const jump=JUMPS[n]; const tag=jump? (jump>n?' 🪜':' 🐍') : '';
    d.style.background = (Math.floor((n-1)/10)+ (n-1)%10)%2 ? 'rgba(255,255,255,.03)':'transparent';
    if(jump) d.style.background = jump>n?'rgba(64,192,160,.14)':'rgba(224,80,80,.14)';
    d.innerHTML=n+tag;
    board.appendChild(d);
  }
  // tokens
  ['#f0c040','#5090e0'].forEach((c,i)=>{ const t=document.createElement('div'); t.className='sl-tok'; t.id='tok'+i; t.style.background=c; board.appendChild(t); });
}
function render(){
  for(let i=0;i<2;i++){ const t=document.getElementById('tok'+i); if(!t)continue;
    if(pos[i]===0){ t.style.left='2px'; t.style.top=(cell*10-22)+'px'; }
    else { const [x,y]=cellXY(pos[i]); t.style.left=(x+cell/2-10+(i?6:-6))+'px'; t.style.top=(y+cell/2-10)+'px'; }
  }
}
function turnName(){ return turn===0?'🟡 You':(mode==='ai'?'🤖 AI':'🔵 Player 2'); }
function setMsg(t){ document.getElementById('msg').textContent=t; }
function roll(){
  if(over||busy) return;
  if(mode==='ai'&&turn===1) return;
  doRoll();
}
function doRoll(){
  busy=true; document.getElementById('roll').disabled=true;
  const d=1+(0|Math.random()*6);
  document.getElementById('die').textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][d-1];
  sfx('select');
  let np=pos[turn]+d;
  if(np>100){ np=100-(np-100); setMsg(turnName()+' rolled '+d+' — bounces back!'); } // bounce off 100
  else setMsg(turnName()+' rolled '+d);
  pos[turn]=np; render();
  setTimeout(()=>{
    if(JUMPS[pos[turn]]){ const to=JUMPS[pos[turn]]; const up=to>pos[turn]; pos[turn]=to; sfx(up?'coin':'lose'); setMsg(turnName()+(up?' climbs a ladder! 🪜':' hits a snake! 🐍')); render(); }
    setTimeout(()=>{
      if(pos[turn]===100){ return win(); }
      turn=1-turn; busy=false;
      if(mode==='ai'&&turn===1){ busy=true; setMsg('🤖 AI rolling…'); setTimeout(doRoll,800); }
      else { document.getElementById('roll').disabled=false; setMsg(turnName()+' — roll!'); }
    }, JUMPS[pos[turn]]?600:250);
  }, 350);
}
function win(){
  over=true;
  const youWin=turn===0;
  if(youWin&&window.GH)GH.score.inc(GAME,'wins',1);
  document.getElementById('win-msg').textContent=youWin?'🏆 YOU WIN!':(mode==='ai'?'🤖 AI WINS!':'🏆 PLAYER 2 WINS!');
  document.getElementById('win-sub').textContent='Reached 100!';
  setTimeout(()=>document.getElementById('win-overlay').classList.add('show'),400);
}
window.addEventListener('resize',()=>{ buildBoard(); render(); });
newGame();
</script>
</body>
</html>
