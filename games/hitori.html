<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hitori</title>
<link rel="stylesheet" href="shared.css">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="../themes/themes.css">
<script src="../themes/themes.js" defer></script>
<script src="../lang/lang.js" defer></script>
<style>
.hi-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 12px;}
.hi-grid{display:grid;gap:3px;background:var(--surface);padding:8px;border-radius:12px;border:2px solid var(--border);}
.hi-cell{display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-weight:700;border-radius:6px;cursor:pointer;background:var(--surface2);color:var(--text);transition:background .12s;}
.hi-cell.black{background:#0a0a0f;color:#333;}
.hi-cell.circle{box-shadow:inset 0 0 0 3px var(--green);}
.hi-cell.err{outline:2px solid var(--red);}
.hi-hint{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--dim);text-align:center;max-width:460px;line-height:1.6;}
</style>
</head>
<body>
<div class="hdr">
  <a class="back-btn" href="../index.html">← HUB</a>
  <span class="h-title" style="color:#f0a040">⬛ HITORI</span>
  <div class="h-btns">
    <select id="size-sel" onchange="newGame()"><option value="5" selected>5×5</option><option value="6">6×6</option><option value="7">7×7</option></select>
    <button class="hbtn" onclick="newGame()">NEW GAME</button>
  </div>
</div>
<div class="hi-wrap">
  <div class="hi-hint">Shade cells so no number repeats in any row or column. Shaded cells can't touch (edge-wise), and the un-shaded cells must all connect. Tap to shade / un-shade.</div>
  <div id="grid" class="hi-grid"></div>
</div>
<div id="win-overlay">
  <div class="win-msg" id="win-msg">🏆 SOLVED!</div>
  <div class="win-sub" id="win-sub"></div>
  <div class="win-btns"><button class="win-btn" onclick="newGame()">PLAY AGAIN</button><button class="win-btn sec" onclick="location.href='../index.html'">← HUB</button></div>
</div>
<script>
const GAME='hitori';
function sfx(n){try{if(window.GH)GH.sfx.play(n);}catch(e){}}
let N=5, nums=[], black=[], solBlack=[], over=false;
function newGame(){
  N=parseInt(document.getElementById('size-sel').value,10); over=false;
  document.getElementById('win-overlay').classList.remove('show');
  gen();
  black=Array.from({length:N},()=>Array(N).fill(false));
  render();
}
function genLatin(){
  const base=Array.from({length:N},(_,r)=>Array.from({length:N},(_,c)=>((r+c)%N)+1));
  const rp=[...Array(N).keys()]; shuffle(rp); const cp=[...Array(N).keys()]; shuffle(cp);
  const vp=[...Array(N).keys()].map(x=>x+1); shuffle(vp);
  const M=Array.from({length:N},()=>Array(N).fill(0));
  for(let r=0;r<N;r++)for(let c=0;c<N;c++) M[r][c]=vp[base[rp[r]][cp[c]]-1];
  return M;
}
function genBlackPattern(){
  const b=Array.from({length:N},()=>Array(N).fill(false));
  const cells=[]; for(let r=0;r<N;r++)for(let c=0;c<N;c++)cells.push([r,c]); shuffle(cells);
  const target=Math.max(2,Math.round(N*N*0.22)); let placed=0;
  for(const [r,c] of cells){ if(placed>=target)break;
    if((r>0&&b[r-1][c])||(r<N-1&&b[r+1][c])||(c>0&&b[r][c-1])||(c<N-1&&b[r][c+1])) continue;
    b[r][c]=true; placed++;
  }
  if(placed===0||!whiteConnected(b)) return null;
  return b;
}
function gen(){
  for(let attempt=0;attempt<300;attempt++){
    const L=genLatin(); const b=genBlackPattern(); if(!b) continue;
    const g=L.map(row=>row.slice());
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){ if(b[r][c]){
      const opts=[]; for(let k=0;k<N;k++){ if(!b[r][k]&&k!==c)opts.push(L[r][k]); if(!b[k][c]&&k!==r)opts.push(L[k][c]); }
      g[r][c]= opts.length? opts[0|Math.random()*opts.length] : L[r][c];
    }}
    nums=g; solBlack=b; return;
  }
  // fallback (rare): Latin square + a couple forced blacks
  const L=genLatin(); nums=L.map(r=>r.slice()); solBlack=Array.from({length:N},()=>Array(N).fill(false));
  solBlack[0][1]=true; nums[0][1]=L[0][0];
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]];}}
function whiteConnected(b){
  let start=null; for(let r=0;r<N&&!start;r++)for(let c=0;c<N;c++)if(!b[r][c]){start=[r,c];break;}
  if(!start)return false;
  const seen=Array.from({length:N},()=>Array(N).fill(false)); const st=[start]; seen[start[0]][start[1]]=true; let cnt=1;
  while(st.length){ const [r,c]=st.pop(); for(const [dr,dc] of [[0,1],[0,-1],[1,0],[-1,0]]){ const nr=r+dr,nc=c+dc; if(nr>=0&&nr<N&&nc>=0&&nc<N&&!b[nr][nc]&&!seen[nr][nc]){ seen[nr][nc]=true; cnt++; st.push([nr,nc]); } } }
  let whites=0; for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!b[r][c])whites++;
  return cnt===whites;
}
function toggle(r,c){ if(over)return; black[r][c]=!black[r][c]; sfx('select'); render(); if(checkWin())win(); }
function adjViolations(){ const bad=new Set(); for(let r=0;r<N;r++)for(let c=0;c<N;c++){ if(black[r][c]){ if(r<N-1&&black[r+1][c]){bad.add(r+','+c);bad.add((r+1)+','+c);} if(c<N-1&&black[r][c+1]){bad.add(r+','+c);bad.add(r+','+(c+1));} } } return bad; }
function checkWin(){
  // no dup in rows/cols among white
  for(let r=0;r<N;r++){ const seen=new Set(); for(let c=0;c<N;c++){ if(!black[r][c]){ if(seen.has(nums[r][c]))return false; seen.add(nums[r][c]); } } }
  for(let c=0;c<N;c++){ const seen=new Set(); for(let r=0;r<N;r++){ if(!black[r][c]){ if(seen.has(nums[r][c]))return false; seen.add(nums[r][c]); } } }
  // no adjacent black
  if(adjViolations().size>0)return false;
  // white connected
  return whiteConnected(black);
}
function render(){
  const g=document.getElementById('grid'); if(!g)return;
  const cell=Math.floor(Math.min(window.innerWidth-40,400)/N);
  g.style.gridTemplateColumns=`repeat(${N},${cell}px)`; g.innerHTML='';
  const bad=adjViolations();
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){ const d=document.createElement('div');
    d.className='hi-cell'+(black[r][c]?' black':'')+(bad.has(r+','+c)?' err':'');
    d.style.width=cell+'px'; d.style.height=cell+'px'; d.style.fontSize=(cell*0.45)+'px';
    d.textContent=nums[r][c]; d.onclick=()=>toggle(r,c); g.appendChild(d);
  }
}
function win(){ over=true; if(window.GH)GH.score.inc(GAME,'wins',1); document.getElementById('win-sub').textContent='No repeats, all connected! 🎉'; setTimeout(()=>document.getElementById('win-overlay').classList.add('show'),300); }
window.addEventListener('resize',()=>{ if(nums.length) render(); });
newGame();
</script>
</body>
</html>
