<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Space Shooter</title>
<link rel="stylesheet" href="shared.css">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="../themes/themes.css">
<script src="../themes/themes.js" defer></script>
<script src="../lang/lang.js" defer></script>
<style>
.ss-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 10px;}
#shooter{background:radial-gradient(circle at 50% 10%,#10142a,#05060c);border:2px solid var(--border);border-radius:10px;max-width:100%;touch-action:none;box-shadow:0 6px 24px rgba(0,0,0,.5);}
.ss-ctrls{display:flex;gap:8px;}
.ss-ctrls button{font-size:18px;width:62px;height:48px;border-radius:10px;border:2px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;}
.ss-ctrls button:active{background:rgba(80,144,224,.2);}
.ss-hint{font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--dim);text-align:center;}
</style>
</head>
<body>
<div class="hdr">
  <a class="back-btn" href="../index.html">← HUB</a>
  <span class="h-title" style="color:#5090e0">🚀 SPACE SHOOTER</span>
  <div class="h-btns"><div class="info-pill">SCORE: <span id="score">0</span></div><div class="info-pill">BEST: <span id="best">0</span></div><div class="info-pill">LIVES: <span id="lives">3</span></div><button class="hbtn" onclick="newGame()">NEW GAME</button></div>
</div>
<div class="ss-wrap">
  <div class="ss-hint">Move: <b>← → / A D</b> · Fire: <b>Space</b> (auto-fire too). Blast the swooping fleet!</div>
  <canvas id="shooter" width="480" height="480"></canvas>
  <div class="ss-ctrls">
    <button onpointerdown="hold('l',1)" onpointerup="hold('l',0)" onpointerleave="hold('l',0)">◀</button>
    <button onpointerdown="fire()">🔫</button>
    <button onpointerdown="hold('r',1)" onpointerup="hold('r',0)" onpointerleave="hold('r',0)">▶</button>
  </div>
</div>
<div id="win-overlay">
  <div class="win-msg" id="win-msg">💥 GAME OVER</div>
  <div class="win-sub" id="win-sub"></div>
  <div class="win-btns"><button class="win-btn" onclick="newGame()">PLAY AGAIN</button><button class="win-btn sec" onclick="location.href='../index.html'">← HUB</button></div>
</div>
<script>
const GAME='spaceshooter';
function sfx(n){try{if(window.GH)GH.sfx.play(n);}catch(e){}}
const cv=document.getElementById('shooter'), ctx=cv.getContext('2d');
const W=cv.width, H=cv.height;
let ship, bullets, enemies, ebullets, score, best, lives, wave, over, raf, L,R, tick, stars;
best=(window.GH?GH.score.get(GAME,'best'):0)||0;
function newGame(){ ship={x:W/2,y:H-36,w:30}; bullets=[]; ebullets=[]; score=0; lives=3; wave=1; over=false; L=R=false; tick=0;
  stars=Array.from({length:40},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2}));
  spawnWave(); document.getElementById('win-overlay').classList.remove('show'); document.getElementById('best').textContent=best; updateHud(); cancelAnimationFrame(raf); raf=requestAnimationFrame(loop); }
function spawnWave(){ enemies=[]; const rows=3, cols=7; for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){ enemies.push({hx:60+c*55, hy:50+r*44, x:60+c*55, y:50+r*44, alive:true, swoop:null, t:Math.random()*6, row:r}); } }
function loop(){ if(over)return; update(); draw(); raf=requestAnimationFrame(loop); }
function update(){
  tick++;
  if(L)ship.x-=6; if(R)ship.x+=6; ship.x=Math.max(ship.w/2,Math.min(W-ship.w/2,ship.x));
  if(tick%12===0) fire(); // auto-fire
  bullets.forEach(b=>b.y-=9); bullets=bullets.filter(b=>b.y>-10);
  ebullets.forEach(b=>b.y+=4); ebullets=ebullets.filter(b=>b.y<H+10);
  const sway=Math.sin(tick*0.03)*30;
  for(const e of enemies){ if(!e.alive)continue;
    if(e.swoop){ e.swoop.t+=0.02; e.x=e.hx+sway + Math.sin(e.swoop.t*6)*60; e.y=e.hy + e.swoop.t*H; if(e.swoop.t>=1){ e.swoop=null; e.y=e.hy; } }
    else { e.x=e.hx+sway; e.y=e.hy; if(Math.random()<0.0008+wave*0.0002) e.swoop={t:0}; }
    if(Math.random()<0.004) ebullets.push({x:e.x,y:e.y});
  }
  // bullet-enemy
  for(const b of bullets){ for(const e of enemies){ if(e.alive&&Math.abs(b.x-e.x)<16&&Math.abs(b.y-e.y)<16){ e.alive=false; b.dead=true; score+=(3-e.row)*10; sfx('hit'); break; } } }
  bullets=bullets.filter(b=>!b.dead);
  // enemy bullet / swoop hits ship
  for(const b of ebullets){ if(Math.abs(b.x-ship.x)<18&&Math.abs(b.y-ship.y)<14){ b.dead=true; hit(); } }
  ebullets=ebullets.filter(b=>!b.dead);
  for(const e of enemies){ if(e.alive&&Math.abs(e.x-ship.x)<22&&Math.abs(e.y-ship.y)<20){ e.alive=false; hit(); } }
  updateHud();
  if(enemies.every(e=>!e.alive)){ wave++; score+=50; spawnWave(); updateHud(); }
}
function hit(){ lives--; sfx('lose'); if(lives<=0) gameOver(); else { ship.x=W/2; ebullets=[]; } }
function fire(){ if(over)return; bullets.push({x:ship.x,y:ship.y-16}); }
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.5)'; stars.forEach(s=>{ s.y+=0.4+s.s*0.3; if(s.y>H)s.y=0; ctx.fillRect(s.x,s.y,s.s,s.s); });
  for(const e of enemies){ if(!e.alive)continue; ctx.fillStyle=['#e05050','#f0a040','#c080e0'][e.row%3]; ctx.beginPath(); ctx.arc(e.x,e.y,11,0,7); ctx.fill(); ctx.fillStyle='#fff'; ctx.fillRect(e.x-5,e.y-2,3,3); ctx.fillRect(e.x+2,e.y-2,3,3); }
  ctx.fillStyle='#f0f0f0'; bullets.forEach(b=>ctx.fillRect(b.x-1.5,b.y-8,3,8));
  ctx.fillStyle='#f0c040'; ebullets.forEach(b=>ctx.fillRect(b.x-1.5,b.y,3,8));
  ctx.fillStyle='#5090e0'; ctx.beginPath(); ctx.moveTo(ship.x,ship.y-14); ctx.lineTo(ship.x+14,ship.y+12); ctx.lineTo(ship.x-14,ship.y+12); ctx.closePath(); ctx.fill();
}
function updateHud(){ document.getElementById('score').textContent=score; document.getElementById('best').textContent=best; document.getElementById('lives').textContent=lives; }
function gameOver(){ over=true; const r=window.GH?GH.score.best(GAME,'best',score,'high'):{value:score,isBest:false}; best=r.value; document.getElementById('best').textContent=best;
  document.getElementById('win-sub').textContent='Score '+score+' · wave '+wave+(r.isBest&&score>0?' — NEW BEST! 🎉':''); setTimeout(()=>document.getElementById('win-overlay').classList.add('show'),300); }
function hold(k,v){ v=!!v; if(k==='l')L=v;else R=v; }
let lastShot=0;
document.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft'||e.key==='a'){L=true;e.preventDefault();} if(e.key==='ArrowRight'||e.key==='d'){R=true;e.preventDefault();} if(e.key===' '){fire();e.preventDefault();} });
document.addEventListener('keyup',e=>{ if(e.key==='ArrowLeft'||e.key==='a')L=false; if(e.key==='ArrowRight'||e.key==='d')R=false; });
newGame();
</script>
</body>
</html>
