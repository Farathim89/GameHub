<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rush Hour</title>
<link rel="stylesheet" href="shared.css">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="../themes/themes.css">
<script src="../themes/themes.js" defer></script>
<script src="../lang/lang.js" defer></script>
<style>
.rh-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 12px;}
.rh-board{position:relative;background:#1a1510;border:3px solid #5a3c20;border-radius:12px;}
.rh-exit{position:absolute;right:-13px;width:12px;height:var(--cell);top:calc(2*var(--cell));background:var(--green);border-radius:0 4px 4px 0;}
.rh-car{position:absolute;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;border:2px solid rgba(255,255,255,.3);box-shadow:inset 0 2px 4px rgba(255,255,255,.2),0 3px 6px rgba(0,0,0,.4);transition:left .12s,top .12s;}
.rh-car.red{background:linear-gradient(145deg,#f05050,#c02020);}
.rh-car.sel{box-shadow:0 0 0 3px var(--accent),0 3px 8px rgba(0,0,0,.6);}
.rh-cell{position:absolute;box-sizing:border-box;border:1px solid rgba(255,255,255,.05);}
.rh-hint{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--dim);text-align:center;max-width:440px;line-height:1.6;}
</style>
</head>
<body>
<div class="hdr">
  <a class="back-btn" href="../index.html">← HUB</a>
  <span class="h-title" style="color:#e05050">🚗 RUSH HOUR</span>
  <div class="h-btns">
    <select id="lvl-sel" onchange="loadLevel(+this.value)"></select>
    <div class="info-pill">MOVES: <span id="moves">0</span></div>
    <button class="hbtn" onclick="loadLevel(lvl)">⟳ RESET</button>
  </div>
</div>
<div class="rh-wrap">
  <div class="rh-hint">Slide the cars and trucks out of the way and drive the <b style="color:#e05050">red car</b> out the right exit. Click a vehicle, then click where to slide it (or use arrow keys).</div>
  <div id="board" class="rh-board"></div>
</div>
<div id="win-overlay">
  <div class="win-msg" id="win-msg">🏆 ESCAPED!</div>
  <div class="win-sub" id="win-sub"></div>
  <div class="win-btns">
    <button class="win-btn" id="next-btn" onclick="nextLevel()">NEXT LEVEL →</button>
    <button class="win-btn sec" onclick="location.href='../index.html'">← HUB</button>
  </div>
</div>
<script>
const GAME='rushhour';
function sfx(n){try{if(window.GH)GH.sfx.play(n);}catch(e){}}
const N=6, CELL=58;
const COLORS=['#f0a040','#40c0a0','#5090e0','#c080e0','#f0c040','#40a0c0','#a0e050','#e080a0','#80d0d0'];
// each vehicle: {x,y,len,dir:'h'|'v', red?}  (first is always the red car on row 2)
const LEVELS=[
  [{x:1,y:2,len:2,dir:'h',red:1},{x:0,y:0,len:3,dir:'v'},{x:3,y:0,len:2,dir:'h'},{x:5,y:1,len:3,dir:'v'},{x:1,y:4,len:2,dir:'h'}],
  [{x:3,y:2,len:2,dir:'h',red:1},{x:2,y:0,len:2,dir:'h'},{x:0,y:1,len:3,dir:'v'},{x:5,y:0,len:3,dir:'v'},{x:1,y:3,len:3,dir:'h'},{x:0,y:4,len:2,dir:'v'},{x:4,y:4,len:2,dir:'h'}],
  [{x:1,y:2,len:2,dir:'h',red:1},{x:0,y:0,len:2,dir:'h'},{x:3,y:0,len:3,dir:'v'},{x:4,y:1,len:2,dir:'v'},{x:0,y:3,len:2,dir:'v'},{x:1,y:4,len:3,dir:'h'},{x:5,y:2,len:3,dir:'v'},{x:3,y:3,len:2,dir:'h'}]
];
let cars=[], sel=-1, moves=0, lvl=0, over=false;

function loadLevel(i){
  lvl=i; cars=LEVELS[i].map((c,id)=>({...c,id})); sel=-1; moves=0; over=false;
  document.getElementById('win-overlay').classList.remove('show');
  document.getElementById('lvl-sel').value=i;
  layout(); render();
}
function layout(){ const b=document.getElementById('board'); b.style.setProperty('--cell',CELL+'px'); b.style.width=N*CELL+'px'; b.style.height=N*CELL+'px'; }
function occ(except){ const g=Array.from({length:N},()=>Array(N).fill(-1)); for(const c of cars){ if(c.id===except)continue; for(let k=0;k<c.len;k++){ const x=c.x+(c.dir==='h'?k:0), y=c.y+(c.dir==='v'?k:0); g[y][x]=c.id; } } return g; }
function canMove(c,steps){
  const g=occ(c.id);
  const dx=c.dir==='h'?Math.sign(steps):0, dy=c.dir==='v'?Math.sign(steps):0;
  let cx=c.x, cy=c.y;
  for(let s=0;s<Math.abs(steps);s++){
    const hx=cx+(c.dir==='h'?(dx>0?c.len:-1):0), hy=cy+(c.dir==='v'?(dy>0?c.len:-1):0);
    const nx=dx>0?hx:cx+dx, ny=dy>0?hy:cy+dy;
    if(nx<0||nx>=N||ny<0||ny>=N||g[ny][nx]!==-1) return false;
    cx+=dx; cy+=dy;
  }
  return true;
}
function moveCar(c,steps){
  if(!canMove(c,steps)){ sfx('error'); return; }
  if(c.dir==='h')c.x+=steps; else c.y+=steps;
  moves++; sfx('move'); render();
  const red=cars.find(v=>v.red); if(red && red.x+red.len>=N){ /* at exit col */ }
  if(red && red.x===N-red.len && canExit(red)) {} // handled in checkWin
  checkWin();
}
function canExit(){ return true; }
function checkWin(){ const red=cars.find(c=>c.red); if(red.x+red.len>=N){ win(); } }
function clickCar(id){ if(over)return; sel=sel===id?-1:id; sfx('select'); render(); }
function clickCell(cx,cy){
  if(over||sel<0) return;
  const c=cars.find(v=>v.id===sel);
  if(c.dir==='h' && cy>=c.y && cy<c.y+1){ const steps = cx< c.x ? cx-c.x : (cx>=c.x+c.len? cx-(c.x+c.len-1) : 0); if(steps)moveStep(c,steps); }
  else if(c.dir==='v' && cx>=c.x && cx<c.x+1){ const steps = cy< c.y ? cy-c.y : (cy>=c.y+c.len? cy-(c.y+c.len-1) : 0); if(steps)moveStep(c,steps); }
}
function moveStep(c,steps){ // move one step at a time toward target for safety
  const dir=Math.sign(steps);
  for(let i=0;i<Math.abs(steps);i++){ if(canMove(c,dir)){ if(c.dir==='h')c.x+=dir; else c.y+=dir; moves++; } else break; }
  sfx('move'); render(); checkWin();
}
function win(){
  over=true;
  const r=window.GH?GH.score.best(GAME,'best_'+lvl,moves,'low'):{value:moves,isBest:false};
  document.getElementById('next-btn').style.display = lvl<LEVELS.length-1?'':'none';
  document.getElementById('win-sub').textContent='Level '+(lvl+1)+' in '+moves+' moves'+(r.isBest?' — NEW BEST! 🎉':'');
  setTimeout(()=>document.getElementById('win-overlay').classList.add('show'),300);
}
function nextLevel(){ if(lvl<LEVELS.length-1)loadLevel(lvl+1); else loadLevel(0); }
function render(){
  const b=document.getElementById('board'); if(!b)return;
  b.innerHTML='<div class="rh-exit"></div>';
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){ const d=document.createElement('div'); d.className='rh-cell'; d.style.cssText+=`left:${x*CELL}px;top:${y*CELL}px;width:${CELL}px;height:${CELL}px;`; d.onclick=()=>clickCell(x,y); b.appendChild(d); }
  cars.forEach(c=>{ const el=document.createElement('div'); el.className='rh-car'+(c.red?' red':'')+(sel===c.id?' sel':'');
    if(!c.red) el.style.background='linear-gradient(145deg,'+COLORS[c.id%COLORS.length]+',rgba(0,0,0,.3))';
    el.style.left=(c.x*CELL+4)+'px'; el.style.top=(c.y*CELL+4)+'px';
    el.style.width=((c.dir==='h'?c.len:1)*CELL-8)+'px'; el.style.height=((c.dir==='v'?c.len:1)*CELL-8)+'px';
    el.textContent=c.red?'🚗':(c.len===3?'🚚':'🚙');
    el.onclick=(e)=>{ e.stopPropagation(); clickCar(c.id); };
    b.appendChild(el);
  });
  document.getElementById('moves').textContent=moves;
}
document.addEventListener('keydown',e=>{
  if(over||sel<0)return; const c=cars.find(v=>v.id===sel); if(!c)return;
  let step=0;
  if((e.key==='ArrowLeft'||e.key==='a')&&c.dir==='h')step=-1;
  if((e.key==='ArrowRight'||e.key==='d')&&c.dir==='h')step=1;
  if((e.key==='ArrowUp'||e.key==='w')&&c.dir==='v')step=-1;
  if((e.key==='ArrowDown'||e.key==='s')&&c.dir==='v')step=1;
  if(step){ e.preventDefault(); moveCar(c,step); }
});
(function init(){ const sel=document.getElementById('lvl-sel'); LEVELS.forEach((_,i)=>{const o=document.createElement('option');o.value=i;o.textContent='Level '+(i+1);sel.appendChild(o);}); loadLevel(0); })();
</script>
</body>
</html>
