<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reaction Time</title>
<link rel="stylesheet" href="shared.css">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="../themes/themes.css">
<script src="../themes/themes.js" defer></script>
<script src="../lang/lang.js" defer></script>
<style>
.rt-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:18px 12px;}
.rt-pad{width:100%;max-width:520px;height:340px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none;font-family:'Orbitron',monospace;text-align:center;transition:background .08s;border:3px solid var(--border);}
.rt-pad.wait{background:#b23030;color:#fff}
.rt-pad.go{background:#1aa84a;color:#fff}
.rt-pad.ready{background:#2a2a4a;color:#cfe}
.rt-pad.result{background:#1a2a4a;color:#fff}
.rt-big{font-size:40px;font-weight:900;}
.rt-sub{font-size:16px;margin-top:8px;opacity:.9}
.rt-stats{display:flex;gap:28px;font-family:'Orbitron',monospace;font-size:14px;}
.rt-stats b{color:var(--accent);font-size:20px;display:block;}
</style>
</head>
<body>
<div class="hdr">
  <a class="back-btn" href="../index.html">← HUB</a>
  <span class="h-title" style="color:#1aa84a">⚡ REACTION TIME</span>
  <div class="h-btns"><div class="info-pill">BEST: <span id="best">—</span></div></div>
</div>
<div class="rt-wrap">
  <div class="rt-pad ready" id="pad" onclick="pad()"><div class="rt-big" id="big">CLICK TO START</div><div class="rt-sub" id="sub">Wait for green, then click as fast as you can</div></div>
  <div class="rt-stats"><div>LAST<b id="last">—</b></div><div>AVG (5)<b id="avg">—</b></div><div>BEST<b id="best2">—</b></div></div>
</div>
<script>
const GAME='reaction';
function sfx(n){try{if(window.GH)GH.sfx.play(n);}catch(e){}}
let state='ready', t0=0, timer=null, times=[], best;
best=(window.GH?GH.score.get(GAME,'best'):0)||0;
showBest();
function showBest(){ const b=best?best+' ms':'—'; document.getElementById('best').textContent=b; document.getElementById('best2').textContent=b; }
function setPad(cls,big,sub){ const p=document.getElementById('pad'); p.className='rt-pad '+cls; document.getElementById('big').textContent=big; document.getElementById('sub').textContent=sub; }
function pad(){
  if(state==='ready'||state==='result'){ // begin waiting
    state='wait'; setPad('wait','WAIT…','Click when it turns GREEN'); sfx('select');
    const delay=900+Math.random()*2600; timer=setTimeout(()=>{ state='go'; t0=performance.now(); setPad('go','CLICK!','GO GO GO'); }, delay);
  } else if(state==='wait'){ // clicked too early
    clearTimeout(timer); state='result'; setPad('result','TOO SOON!','Click to try again'); sfx('error');
  } else if(state==='go'){
    const ms=Math.round(performance.now()-t0); state='result'; sfx('pop');
    times.push(ms); if(times.length>5)times.shift();
    const avg=Math.round(times.reduce((a,b)=>a+b,0)/times.length);
    document.getElementById('last').textContent=ms+' ms'; document.getElementById('avg').textContent=avg+' ms';
    let msg=''; if(ms<200)msg='Lightning fast! ⚡'; else if(ms<300)msg='Great reflexes!'; else if(ms<400)msg='Solid.'; else msg='Keep practising!';
    if(!best||ms<best){ best=ms; if(window.GH)GH.score.best(GAME,'best',ms,'low'); showBest(); msg='NEW BEST! 🎉'; }
    setPad('result',ms+' ms',msg+' — click to go again');
  }
}
</script>
</body>
</html>
