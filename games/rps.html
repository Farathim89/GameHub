<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rock Paper Scissors</title>
<link rel="stylesheet" href="shared.css">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="../themes/themes.css">
<script src="../themes/themes.js" defer></script>
<script src="../lang/lang.js" defer></script>
<style>
.rps-wrap{display:flex;flex-direction:column;align-items:center;gap:20px;padding:24px 12px;}
.rps-score{display:flex;gap:36px;font-family:'Orbitron',monospace;}
.rps-score b{font-size:30px;display:block;}
.rps-you b{color:#f0c040}.rps-ai b{color:#5090e0}
.rps-arena{display:flex;align-items:center;gap:30px;font-size:70px;min-height:90px;}
.rps-vs{font-family:'Orbitron',monospace;font-size:18px;color:var(--dim);}
.rps-msg{font-family:'Orbitron',monospace;font-size:17px;min-height:26px;letter-spacing:1px;}
.rps-btns{display:flex;gap:16px;}
.rps-pick{font-size:46px;width:92px;height:92px;border-radius:18px;border:3px solid var(--border);background:var(--surface);cursor:pointer;transition:transform .1s,border-color .15s;}
.rps-pick:hover{transform:translateY(-4px);border-color:var(--accent);}
.spin{animation:sp .4s linear infinite;}@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="hdr">
  <a class="back-btn" href="../index.html">← HUB</a>
  <span class="h-title" style="color:#f0a040">✊ ROCK PAPER SCISSORS</span>
  <div class="h-btns"><button class="hbtn" onclick="reset()">RESET</button></div>
</div>
<div class="rps-wrap">
  <div class="rps-score"><div class="rps-you">YOU<b id="sy">0</b></div><div class="rps-ai">AI<b id="sa">0</b></div></div>
  <div class="rps-arena"><span id="hy">❔</span><span class="rps-vs">VS</span><span id="ha">❔</span></div>
  <div class="rps-msg" id="msg">First to 5 wins. Make your move!</div>
  <div class="rps-btns">
    <button class="rps-pick" onclick="play(0)" title="Rock">✊</button>
    <button class="rps-pick" onclick="play(1)" title="Paper">✋</button>
    <button class="rps-pick" onclick="play(2)" title="Scissors">✌️</button>
  </div>
</div>
<div id="win-overlay">
  <div class="win-msg" id="win-msg">🏆 YOU WIN!</div>
  <div class="win-sub" id="win-sub"></div>
  <div class="win-btns"><button class="win-btn" onclick="reset()">PLAY AGAIN</button><button class="win-btn sec" onclick="location.href='../index.html'">← HUB</button></div>
</div>
<script>
const GAME='rps';
function sfx(n){try{if(window.GH)GH.sfx.play(n);}catch(e){}}
const EM=['✊','✋','✌️'], NM=['Rock','Paper','Scissors'];
let sy=0, sa=0, busy=false, over=false;
function reset(){ sy=0; sa=0; busy=false; over=false; document.getElementById('win-overlay').classList.remove('show'); document.getElementById('hy').textContent='❔'; document.getElementById('ha').textContent='❔'; upd(); setMsg('First to 5 wins. Make your move!'); }
function upd(){ document.getElementById('sy').textContent=sy; document.getElementById('sa').textContent=sa; }
function setMsg(t){ document.getElementById('msg').textContent=t; }
function play(you){ if(busy||over)return; busy=true; sfx('select');
  const hy=document.getElementById('hy'), ha=document.getElementById('ha'); ha.classList.add('spin'); ha.textContent='🎲';
  setTimeout(()=>{ const ai=0|Math.random()*3; ha.classList.remove('spin'); hy.textContent=EM[you]; ha.textContent=EM[ai];
    let m;
    if(you===ai){ m="Tie — both "+NM[you]+"!"; }
    else if((you+1)%3===ai){ sa++; m="AI's "+NM[ai]+" beats your "+NM[you]+"."; sfx('lose'); }
    else { sy++; m="Your "+NM[you]+" beats "+NM[ai]+"!"; sfx('win'); }
    upd(); setMsg(m);
    if(sy>=5||sa>=5) return finish();
    busy=false;
  }, 420);
}
function finish(){ over=true; const win=sy>5-1; const youWin=sy>sa; if(youWin&&window.GH)GH.score.inc(GAME,'wins',1);
  document.getElementById('win-msg').textContent=youWin?'🏆 YOU WIN!':'🤖 AI WINS!'; document.getElementById('win-sub').textContent='Final score '+sy+' – '+sa; setTimeout(()=>document.getElementById('win-overlay').classList.add('show'),400); }
reset();
</script>
</body>
</html>
