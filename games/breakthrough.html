<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Breakthrough</title>
<link rel="stylesheet" href="shared.css">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="../themes/themes.css">
<script src="../themes/themes.js" defer></script>
<script src="../lang/lang.js" defer></script>
<style>
.bt-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px;}
.bt-board{display:grid;border:3px solid #5a4a2a;border-radius:6px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.5);}
.bt-cell{display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;}
.bt-cell.lt{background:#caa066;} .bt-cell.dk{background:#8a6038;}
.bt-pawn{width:72%;height:72%;border-radius:50%;}
.bt-pawn.p{background:radial-gradient(circle at 35% 30%,#ffe890,#d0a020);}
.bt-pawn.a{background:radial-gradient(circle at 35% 30%,#90c0ff,#3060c0);}
.bt-cell.sel{box-shadow:inset 0 0 0 3px var(--accent);}
.bt-cell.dest::after{content:'';position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(64,192,160,.7);}
.bt-status{font-family:'Orbitron',monospace;font-size:14px;font-weight:700;min-height:20px;}
.bt-hint{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--dim);text-align:center;max-width:430px;}
</style>
</head>
<body>
<div class="hdr">
  <a class="back-btn" href="../index.html">← HUB</a>
  <span class="h-title" style="color:#f0c040">⛁ BREAKTHROUGH</span>
  <div class="h-btns"><select id="mode-sel" onchange="newGame()"><option value="2p">2 PLAYERS</option><option value="ai" selected>VS AI</option></select><select id="size-sel" onchange="newGame()"><option value="6" selected>6×6</option><option value="8">8×8</option></select><button class="hbtn" onclick="newGame()">NEW GAME</button></div>
</div>
<div class="bt-wrap">
  <div class="bt-status" id="status">Your move</div>
  <div class="bt-hint">Pawns move forward 1 (straight to empty, diagonal to empty or to <b>capture</b>). Reach the far row to win!</div>
  <div id="board" class="bt-board"></div>
</div>
<div id="win-overlay">
  <div class="win-msg" id="win-msg">🏆 YOU WIN!</div>
  <div class="win-sub" id="win-sub"></div>
  <div class="win-btns"><button class="win-btn" onclick="newGame()">PLAY AGAIN</button><button class="win-btn sec" onclick="location.href='../index.html'">← HUB</button></div>
</div>
<script>
const GAME='breakthrough';
function sfx(n){try{if(window.GH)GH.sfx.play(n);}catch(e){}}
let N=6, bd=[], turn=1, mode='ai', sel=null, dests=[], over=false, busy=false; // 1=you(bottom,move up) 2=ai(top,move down)
function newGame(){ N=parseInt(document.getElementById('size-sel').value,10); mode=document.getElementById('mode-sel').value;
  bd=Array.from({length:N},()=>Array(N).fill(0));
  for(let c=0;c<N;c++){ bd[0][c]=2; bd[1][c]=2; bd[N-1][c]=1; bd[N-2][c]=1; }
  turn=1; sel=null; dests=[]; over=false; busy=false;
  document.getElementById('win-overlay').classList.remove('show'); render(); status(); }
function inB(r,c){ return r>=0&&r<N&&c>=0&&c<N; }
function movesFor(r,c){ const p=bd[r][c]; const dir=p===1?-1:1; const out=[];
  const nr=r+dir; if(inB(nr,c)&&bd[nr][c]===0) out.push([nr,c]);
  for(const dc of [-1,1]){ const nc=c+dc; if(inB(nr,nc)&&(bd[nr][nc]===0||bd[nr][nc]===(p===1?2:1))) out.push([nr,nc]); }
  return out; }
function allMoves(p){ const mv=[]; for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(bd[r][c]===p)for(const [nr,nc] of movesFor(r,c))mv.push([r,c,nr,nc]); return mv; }
function click(r,c){ if(over||busy||(mode==='ai'&&turn===2))return;
  if(bd[r][c]===turn){ sel=[r,c]; dests=movesFor(r,c); render(); return; }
  if(sel&&dests.some(([dr,dc])=>dr===r&&dc===c)){ doMove(sel[0],sel[1],r,c); } }
function doMove(r,c,nr,nc){ const p=bd[r][c]; bd[nr][nc]=p; bd[r][c]=0; sel=null; dests=[]; sfx('place'); render();
  if((p===1&&nr===0)||(p===2&&nr===N-1)) return win(p);
  if(!bd.flat().includes(p===1?2:1)) return win(p); // captured all
  turn=p===1?2:1; status();
  if(mode==='ai'&&turn===2&&!over){ busy=true; status(); setTimeout(aiMove,350); } }
function aiMove(){ if(over)return; const mv=allMoves(2); if(!mv.length){ busy=false; return win(1); }
  let best=mv[0],bv=-1e9; for(const m of mv){ const sc=evalMove(m); if(sc>bv){bv=sc;best=m;} } busy=false; doMove(best[0],best[1],best[2],best[3]); }
function evalMove([r,c,nr,nc]){ let s=Math.random()*0.5; const target=bd[nr][nc];
  if(target===1)s+=5; // capture
  if(nr===N-1)s+=1000; // reach goal
  s += nr*2; // advance
  // defensive: landing where it can be captured by player next (diagonal from row nr+1)
  for(const dc of [-1,1]){ if(inB(nr+1,nc+dc)&&bd[nr+1][nc+dc]===1) s-=3; }
  // block player advance: capturing a player pawn near our side good
  if(target===1 && r<=2) s+=2;
  return s; }
function render(){ const b=document.getElementById('board'); const cell=Math.floor(Math.min(window.innerWidth-30,440)/N); b.style.gridTemplateColumns=`repeat(${N},${cell}px)`; b.innerHTML='';
  const destSet=new Set(dests.map(d=>d.join(','))); for(let r=0;r<N;r++)for(let c=0;c<N;c++){ const d=document.createElement('div'); d.className='bt-cell '+((r+c)%2?'dk':'lt')+(sel&&sel[0]===r&&sel[1]===c?' sel':'')+(destSet.has(r+','+c)?' dest':''); d.style.width=cell+'px'; d.style.height=cell+'px'; if(bd[r][c]){const pw=document.createElement('div');pw.className='bt-pawn '+(bd[r][c]===1?'p':'a');d.appendChild(pw);} d.onclick=()=>click(r,c); b.appendChild(d); } }
function status(){ if(over)return; const el=document.getElementById('status'); el.textContent=busy?'🤖 AI thinking…':(turn===1?'🟡 Your move':'🔵 Player 2 move'); el.style.color=turn===1?'#f0c040':'#5090e0'; }
function win(p){ over=true; busy=false; const youWin=p===1; if(youWin&&mode==='ai'&&window.GH)GH.score.inc(GAME,'wins',1); document.getElementById('win-msg').textContent=youWin?'🏆 YOU WIN!':(mode==='ai'?'🤖 AI WINS!':'🏆 PLAYER 2 WINS!'); document.getElementById('win-sub').textContent='Broke through!'; setTimeout(()=>document.getElementById('win-overlay').classList.add('show'),300); }
window.addEventListener('resize',()=>{ if(bd.length)render(); });
newGame();
</script>
</body>
</html>
