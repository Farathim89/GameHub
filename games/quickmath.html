<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quick Math</title>
<link rel="stylesheet" href="shared.css">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="../themes/themes.css">
<script src="../themes/themes.js" defer></script>
<script src="../lang/lang.js" defer></script>
<style>
.qm-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;padding:22px 12px;}
.qm-top{display:flex;gap:26px;font-family:'Orbitron',monospace;font-size:14px;}
.qm-top b{color:var(--accent);font-size:22px;display:block;}
.qm-q{font-family:'Orbitron',monospace;font-size:clamp(34px,10vw,60px);font-weight:900;min-height:72px;}
.qm-in{font-family:'Orbitron',monospace;font-size:30px;text-align:center;width:min(80%,260px);padding:12px;border-radius:10px;background:var(--surface);color:var(--fg);border:3px solid var(--accent);}
.qm-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:min(92vw,420px);}
.qm-opt{font-family:'Orbitron',monospace;font-size:24px;font-weight:800;padding:18px;border-radius:12px;background:var(--surface);color:var(--fg);border:3px solid var(--border);cursor:pointer;transition:transform .08s;}
.qm-opt:hover{transform:translateY(-3px);border-color:var(--accent);}
.qm-opt.good{background:var(--green);border-color:var(--green);color:#071407}
.qm-opt.bad{background:#c02030;border-color:#c02030;color:#fff}
.qm-bar{width:min(92vw,420px);height:10px;background:var(--surface);border-radius:5px;overflow:hidden;}
.qm-bar i{display:block;height:100%;background:var(--green);width:100%;}
.qm-msg{font-family:'Orbitron',monospace;font-size:15px;min-height:22px;}
</style>
</head>
<body>
<div class="hdr">
  <a class="back-btn" href="../index.html">← HUB</a>
  <span class="h-title" style="color:#40c0a0">➗ QUICK MATH</span>
  <div class="h-btns"><div class="info-pill">BEST: <span id="best">0</span></div><button class="hbtn" onclick="newGame()">RESTART</button></div>
</div>
<div class="qm-wrap">
  <div class="qm-top"><div>SCORE<b id="score">0</b></div><div>STREAK<b id="streak">0</b></div><div>TIME<b id="time">60</b></div></div>
  <div class="qm-bar"><i id="bar"></i></div>
  <div class="qm-q" id="q">—</div>
  <div class="qm-opts" id="opts"></div>
  <div class="qm-msg" id="msg">Answer as many as you can in 60 seconds!</div>
</div>
<div id="win-overlay">
  <div class="win-msg" id="win-msg">⏱ TIME!</div>
  <div class="win-sub" id="win-sub"></div>
  <div class="win-btns"><button class="win-btn" onclick="newGame()">PLAY AGAIN</button><button class="win-btn sec" onclick="location.href='../index.html'">← HUB</button></div>
</div>
<script>
const GAME='quickmath';
function sfx(n){try{if(window.GH)GH.sfx.play(n);}catch(e){}}
let score=0, streak=0, ans=0, timeLeft=60, timer=null, best, over=false, started=false;
best=(window.GH?GH.score.get(GAME,'best'):0)||0;
document.getElementById('best').textContent=best;
function newGame(){ score=0; streak=0; timeLeft=60; over=false; started=false; clearInterval(timer); document.getElementById('win-overlay').classList.remove('show'); document.getElementById('best').textContent=best; upd(); document.getElementById('bar').style.width='100%'; newQ(); document.getElementById('msg').textContent='Answer as many as you can in 60 seconds!'; }
function upd(){ document.getElementById('score').textContent=score; document.getElementById('streak').textContent=streak; document.getElementById('time').textContent=Math.max(0,timeLeft); }
function begin(){ if(started)return; started=true; const total=60; timer=setInterval(()=>{ timeLeft--; upd(); document.getElementById('bar').style.width=(Math.max(0,timeLeft)/total*100)+'%'; if(timeLeft<=0)end(); },1000); }
function newQ(){ const diff=1+Math.floor(score/5); let a,b,op,res; const ops=diff>=2?['+','-','×']:['+','-']; op=ops[0|Math.random()*ops.length];
  if(op==='+'){ a=rnd(5,10+diff*6); b=rnd(5,10+diff*6); res=a+b; } else if(op==='-'){ a=rnd(10,15+diff*6); b=rnd(2,a); res=a-b; } else { a=rnd(2,4+diff*2); b=rnd(2,4+diff*2); res=a*b; }
  ans=res; document.getElementById('q').textContent=a+' '+op+' '+b+' = ?';
  const opts=new Set([res]); while(opts.size<4){ let d=res+rnd(-6,6)+(Math.random()<.3?rnd(-1,1)*10:0); if(d>=0&&d!==res)opts.add(d); }
  const arr=[...opts]; for(let i=arr.length-1;i>0;i--){const j=0|Math.random()*(i+1);[arr[i],arr[j]]=[arr[j],arr[i]];}
  const o=document.getElementById('opts'); o.innerHTML=''; arr.forEach(v=>{ const b=document.createElement('button'); b.className='qm-opt'; b.textContent=v; b.onclick=()=>answer(v,b); o.appendChild(b); });
}
function rnd(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
function answer(v,el){ if(over)return; begin();
  if(v===ans){ score++; streak++; sfx('pop'); el.classList.add('good'); if(streak>0&&streak%5===0){ timeLeft+=3; document.getElementById('msg').textContent='Streak '+streak+'! +3 seconds ⏱'; } upd(); setTimeout(newQ,150); }
  else { streak=0; sfx('error'); el.classList.add('bad'); upd(); const good=[...document.querySelectorAll('.qm-opt')].find(b=>+b.textContent===ans); if(good)good.classList.add('good'); document.getElementById('msg').textContent='Nope! It was '+ans+'.'; setTimeout(newQ,550); }
}
function end(){ over=true; clearInterval(timer); if(score>best){ best=score; if(window.GH)GH.score.best(GAME,'best',best,'high'); } document.getElementById('best').textContent=best;
  document.getElementById('win-sub').textContent='You solved '+score+' problems. Best '+best+'.'; setTimeout(()=>document.getElementById('win-overlay').classList.add('show'),300); }
newGame();
</script>
</body>
</html>
