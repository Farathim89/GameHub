<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Snake</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="../themes/themes.css">
<script src="../themes/themes.js" defer></script>
<script src="../lang/lang.js" defer></script>
<style>
.sn-wrap{display:flex;flex-direction:column;align-items:center;padding:14px;gap:12px;}
#cv{border:3px solid var(--border);border-radius:10px;background:var(--surface);touch-action:none;max-width:96vw;}
.dpad{display:none;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:6px;}
.dpad button{font-size:22px;background:var(--surface2);border:2px solid var(--border);color:var(--text);border-radius:10px;cursor:pointer;}
.dpad button:active{border-color:var(--accent);}
@media(pointer:coarse){.dpad{display:grid;}}
.paused-lbl{font-family:'Orbitron',monospace;font-size:12px;color:var(--accent);letter-spacing:2px;min-height:16px;}
</style>
</head>
<body>
<div class="hdr">
  <a class="back-btn" href="../index.html">← HUB</a>
  <span class="h-title" style="color:#34d399">🐍 SNAKE</span>
  <div class="h-btns">
    <select id="speed-sel" onchange="newGame()">
      <option value="160">SLOW</option>
      <option value="110" selected>NORMAL</option>
      <option value="70">FAST</option>
      <option value="45">INSANE</option>
    </select>
    <div class="info-pill">SCORE: <span id="sc">0</span></div>
    <div class="info-pill">BEST: <span id="best">0</span></div>
    <button class="hbtn" onclick="togglePause()" id="pause-btn">⏸ PAUSE</button>
    <button class="hbtn" onclick="newGame()">NEW GAME</button>
  </div>
</div>

<div class="sn-wrap">
  <div class="paused-lbl" id="paused-lbl"></div>
  <canvas id="cv" width="480" height="480"></canvas>
  <div class="dpad">
    <span></span><button onclick="setDir(0,-1)">▲</button><span></span>
    <button onclick="setDir(-1,0)">◀</button><button onclick="togglePause()">⏯</button><button onclick="setDir(1,0)">▶</button>
    <span></span><button onclick="setDir(0,1)">▼</button><span></span>
  </div>
  <div style="font-family:'Orbitron',monospace;font-size:10px;color:var(--dim);letter-spacing:1px;">
    ARROWS / WASD · SPACE = PAUSE · SWIPE ON TOUCH
  </div>
</div>

<div id="win-overlay">
  <div class="win-msg" id="win-msg">💀 GAME OVER</div>
  <div class="win-sub" id="win-sub"></div>
  <div class="win-btns">
    <button class="win-btn" onclick="newGame()">PLAY AGAIN</button>
    <button class="win-btn sec" onclick="location.href='../index.html'">← HUB</button>
  </div>
</div>

<script>
const N=24; // grid cells
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let snake=[],dir={x:1,y:0},nextDir={x:1,y:0},food=null,score=0,best=0,tick=null,speed=110,paused=false,dead=false,queue=[];

try{best=parseInt(localStorage.getItem('gamehub.snake.best'))||0;}catch(e){}
document.getElementById('best').textContent=best;

function fitCanvas(){
  const s=Math.min(480,window.innerWidth-40,window.innerHeight-220);
  cv.style.width=s+'px';cv.style.height=s+'px';
}
window.addEventListener('resize',fitCanvas);fitCanvas();

function newGame(){
  speed=parseInt(document.getElementById('speed-sel').value);
  snake=[{x:8,y:12},{x:7,y:12},{x:6,y:12}];
  dir={x:1,y:0};nextDir={x:1,y:0};queue=[];
  score=0;paused=false;dead=false;
  document.getElementById('sc').textContent=0;
  document.getElementById('paused-lbl').textContent='';
  document.getElementById('pause-btn').textContent='⏸ PAUSE';
  document.getElementById('win-overlay').classList.remove('show');
  placeFood();
  clearInterval(tick);
  tick=setInterval(step,speed);
  draw();
}

function placeFood(){
  let f;
  do{f={x:0|Math.random()*N,y:0|Math.random()*N};}
  while(snake.some(s=>s.x===f.x&&s.y===f.y));
  food=f;
}

function setDir(x,y){
  const last=queue.length?queue[queue.length-1]:dir;
  if(last.x===-x&&last.y===-y)return; // no 180° turns
  if(last.x===x&&last.y===y)return;
  queue.push({x,y});
}

function step(){
  if(paused||dead)return;
  if(queue.length)dir=queue.shift();
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  // wall or self collision
  if(head.x<0||head.x>=N||head.y<0||head.y>=N||snake.some(s=>s.x===head.x&&s.y===head.y)){
    die();return;
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score+=10;
    document.getElementById('sc').textContent=score;
    placeFood();
    // speed up slightly every 5 foods
    if(score%50===0&&speed>35){speed-=5;clearInterval(tick);tick=setInterval(step,speed);}
  } else {
    snake.pop();
  }
  draw();
}

function die(){
  dead=true;clearInterval(tick);
  if(score>best){best=score;try{localStorage.setItem('gamehub.snake.best',best);}catch(e){}}
  document.getElementById('best').textContent=best;
  draw();
  setTimeout(()=>{
    document.getElementById('win-msg').textContent='💀 GAME OVER';
    document.getElementById('win-sub').textContent='Score: '+score+(score>=best&&score>0?' — NEW BEST!':' · Best: '+best);
    document.getElementById('win-overlay').classList.add('show');
  },400);
}

function togglePause(){
  if(dead)return;
  paused=!paused;
  document.getElementById('paused-lbl').textContent=paused?'⏸ PAUSED — PRESS SPACE':'';
  document.getElementById('pause-btn').textContent=paused?'▶ RESUME':'⏸ PAUSE';
}

function draw(){
  const cs=cv.width/N;
  const css=getComputedStyle(document.documentElement);
  const accent=css.getPropertyValue('--accent').trim()||'#f0c040';
  const green=css.getPropertyValue('--green').trim()||'#40c0a0';
  ctx.clearRect(0,0,cv.width,cv.height);
  // grid dots
  ctx.fillStyle='rgba(255,255,255,.04)';
  for(let x=0;x<N;x++)for(let y=0;y<N;y++)ctx.fillRect(x*cs+cs/2-1,y*cs+cs/2-1,2,2);
  // food
  ctx.fillStyle=accent;
  ctx.beginPath();
  ctx.arc(food.x*cs+cs/2,food.y*cs+cs/2,cs*0.36,0,Math.PI*2);
  ctx.fill();
  // snake
  snake.forEach((s,i)=>{
    const t=i/snake.length;
    ctx.fillStyle=i===0?'#fff':green;
    ctx.globalAlpha=i===0?1:1-t*0.55;
    const pad=i===0?1:2;
    r(ctx,s.x*cs+pad,s.y*cs+pad,cs-pad*2,cs-pad*2,5);
  });
  ctx.globalAlpha=1;
}
function r(ctx,x,y,w,h,rad){
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,rad);
  ctx.fill();
}

document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowup'||k==='w'){e.preventDefault();setDir(0,-1);}
  else if(k==='arrowdown'||k==='s'){e.preventDefault();setDir(0,1);}
  else if(k==='arrowleft'||k==='a'){e.preventDefault();setDir(-1,0);}
  else if(k==='arrowright'||k==='d'){e.preventDefault();setDir(1,0);}
  else if(k===' '){e.preventDefault();togglePause();}
});

// touch swipe
let touchStart=null;
cv.addEventListener('touchstart',e=>{touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
cv.addEventListener('touchmove',e=>{
  if(!touchStart)return;
  const dx=e.touches[0].clientX-touchStart.x,dy=e.touches[0].clientY-touchStart.y;
  if(Math.abs(dx)<24&&Math.abs(dy)<24)return;
  if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);
  else setDir(0,dy>0?1:-1);
  touchStart=null;
},{passive:true});

newGame();
</script>
</body>
</html>
