<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aim Trainer</title>
<link rel="stylesheet" href="shared.css">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="../themes/themes.css">
<script src="../themes/themes.js" defer></script>
<script src="../lang/lang.js" defer></script>
<style>
.at-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 10px;}
#aim{background:#0a0d16;border:2px solid var(--border);border-radius:10px;max-width:100%;touch-action:none;cursor:crosshair;box-shadow:0 6px 24px rgba(0,0,0,.5);}
.at-hint{font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--dim);text-align:center;}
</style>
</head>
<body>
<div class="hdr">
  <a class="back-btn" href="../index.html">← HUB</a>
  <span class="h-title" style="color:#e05050">🎯 AIM TRAINER</span>
  <div class="h-btns"><div class="info-pill">HITS: <span id="hits">0</span></div><div class="info-pill">BEST: <span id="best">0</span></div><div class="info-pill">TIME: <span id="time">30</span></div><button class="hbtn" onclick="newGame()">NEW GAME</button></div>
</div>
<div class="at-wrap">
  <div class="at-hint">Click the targets as fast as you can — 30 seconds. Missing a shot costs you points!</div>
  <canvas id="aim" width="560" height="420"></canvas>
</div>
<div id="win-overlay">
  <div class="win-msg" id="win-msg">⏱ TIME!</div>
  <div class="win-sub" id="win-sub"></div>
  <div class="win-btns"><button class="win-btn" onclick="newGame()">PLAY AGAIN</button><button class="win-btn sec" onclick="location.href='../index.html'">← HUB</button></div>
</div>
<script>
const GAME='aimtrainer';
function sfx(n){try{if(window.GH)GH.sfx.play(n);}catch(e){}}
const cv=document.getElementById('aim'), ctx=cv.getContext('2d');
const W=cv.width, H=cv.height;
let target, hits, misses, best, timeLeft, over, raf, started, timer, lifeT;
best=(window.GH?GH.score.get(GAME,'best'):0)||0;
function newGame(){ hits=0; misses=0; timeLeft=30; over=false; started=false; clearInterval(timer);
  spawn(); document.getElementById('win-overlay').classList.remove('show'); document.getElementById('best').textContent=best; updateHud(); draw(); }
function spawn(){ const r=Math.max(16, 34 - hits*0.4); target={x:r+Math.random()*(W-2*r), y:r+Math.random()*(H-2*r), r, born:performance.now()}; lifeT=Math.max(600, 1500-hits*25); }
function begin(){ if(started)return; started=true; timer=setInterval(()=>{ timeLeft--; updateHud(); if(timeLeft<=0)end(); },1000); loop(); }
function loop(){ if(over)return; // targets expire
  if(started && performance.now()-target.born>lifeT){ misses++; spawn(); }
  draw(); raf=requestAnimationFrame(loop); }
function shoot(x,y){ if(over)return; if(!started)begin();
  const d=Math.hypot(x-target.x,y-target.y);
  if(d<=target.r){ hits++; sfx('pop'); spawn(); } else { misses++; sfx('error'); }
  updateHud(); }
function updateHud(){ document.getElementById('hits').textContent=hits; document.getElementById('best').textContent=best; document.getElementById('time').textContent=Math.max(0,timeLeft); }
function draw(){ ctx.clearRect(0,0,W,H);
  // target rings
  const t=target; ctx.fillStyle='#e05050'; ctx.beginPath(); ctx.arc(t.x,t.y,t.r,0,7); ctx.fill(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(t.x,t.y,t.r*0.62,0,7); ctx.fill(); ctx.fillStyle='#e05050'; ctx.beginPath(); ctx.arc(t.x,t.y,t.r*0.3,0,7); ctx.fill();
  if(!started){ ctx.fillStyle='rgba(255,255,255,.85)'; ctx.font='16px Orbitron,monospace'; ctx.textAlign='center'; ctx.fillText('CLICK THE TARGET TO START',W/2,30); }
}
function end(){ over=true; clearInterval(timer); const acc=hits+misses>0?Math.round(hits/(hits+misses)*100):0; const score=Math.max(0,hits);
  const r=window.GH?GH.score.best(GAME,'best',score,'high'):{value:score,isBest:false}; best=r.value; document.getElementById('best').textContent=best;
  document.getElementById('win-sub').textContent=hits+' hits · '+acc+'% accuracy'+(r.isBest&&score>0?' — NEW BEST! 🎉':''); setTimeout(()=>document.getElementById('win-overlay').classList.add('show'),300); }
function pos(e){ const rect=cv.getBoundingClientRect(); const cx=(e.touches?e.touches[0].clientX:e.clientX), cy=(e.touches?e.touches[0].clientY:e.clientY); return [(cx-rect.left)*(W/rect.width),(cy-rect.top)*(H/rect.height)]; }
cv.addEventListener('mousedown',e=>{e.preventDefault();const [x,y]=pos(e);shoot(x,y);});
cv.addEventListener('touchstart',e=>{e.preventDefault();const [x,y]=pos(e);shoot(x,y);},{passive:false});
newGame();
</script>
</body>
</html>
