<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Color Match</title>
<link rel="stylesheet" href="shared.css">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="../themes/themes.css">
<script src="../themes/themes.js" defer></script>
<script src="../lang/lang.js" defer></script>
<style>
.cm-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;padding:22px 12px;}
.cm-top{display:flex;gap:26px;font-family:'Orbitron',monospace;font-size:14px;}
.cm-top b{color:var(--accent);font-size:22px;display:block;}
.cm-word{font-family:'Orbitron',monospace;font-size:clamp(44px,13vw,86px);font-weight:900;min-height:100px;letter-spacing:2px;text-shadow:0 2px 10px rgba(0,0,0,.4);}
.cm-ask{font-family:'Orbitron',monospace;font-size:15px;color:var(--dim);letter-spacing:1px;}
.cm-btns{display:flex;gap:18px;}
.cm-b{font-family:'Orbitron',monospace;font-size:20px;font-weight:800;padding:18px 44px;border-radius:14px;border:3px solid var(--border);background:var(--surface);color:var(--fg);cursor:pointer;transition:transform .08s;}
.cm-b:hover{transform:translateY(-3px);}
.cm-b.yes{border-color:var(--green);color:var(--green)}
.cm-b.no{border-color:#e05050;color:#e05050}
.cm-bar{width:min(92vw,420px);height:10px;background:var(--surface);border-radius:5px;overflow:hidden;}
.cm-bar i{display:block;height:100%;background:var(--green);width:100%;}
.cm-msg{font-family:'Orbitron',monospace;font-size:15px;min-height:22px;}
</style>
</head>
<body>
<div class="hdr">
  <a class="back-btn" href="../index.html">← HUB</a>
  <span class="h-title" style="color:#c080e0">🎨 COLOR MATCH</span>
  <div class="h-btns"><div class="info-pill">BEST: <span id="best">0</span></div><button class="hbtn" onclick="newGame()">RESTART</button></div>
</div>
<div class="cm-wrap">
  <div class="cm-top"><div>SCORE<b id="score">0</b></div><div>STREAK<b id="streak">0</b></div><div>TIME<b id="time">45</b></div></div>
  <div class="cm-bar"><i id="bar"></i></div>
  <div class="cm-ask">Does the WORD match its INK colour?</div>
  <div class="cm-word" id="word">—</div>
  <div class="cm-btns"><button class="cm-b yes" onclick="answer(true)">✓ MATCH</button><button class="cm-b no" onclick="answer(false)">✗ NO MATCH</button></div>
  <div class="cm-msg" id="msg">45 seconds — keep your streak alive!</div>
</div>
<div id="win-overlay">
  <div class="win-msg" id="win-msg">⏱ TIME!</div>
  <div class="win-sub" id="win-sub"></div>
  <div class="win-btns"><button class="win-btn" onclick="newGame()">PLAY AGAIN</button><button class="win-btn sec" onclick="location.href='../index.html'">← HUB</button></div>
</div>
<script>
const GAME='colormatch';
function sfx(n){try{if(window.GH)GH.sfx.play(n);}catch(e){}}
const COLORS=[['RED','#e05050'],['BLUE','#4a90e2'],['GREEN','#3fb950'],['YELLOW','#f0c040'],['PURPLE','#c080e0'],['ORANGE','#f0883e']];
let score=0, streak=0, isMatch=false, timeLeft=45, timer=null, best, over=false, started=false;
best=(window.GH?GH.score.get(GAME,'best'):0)||0;
document.getElementById('best').textContent=best;
function newGame(){ score=0; streak=0; timeLeft=45; over=false; started=false; clearInterval(timer); document.getElementById('win-overlay').classList.remove('show'); document.getElementById('best').textContent=best; upd(); document.getElementById('bar').style.width='100%'; newRound(); document.getElementById('msg').textContent='45 seconds — keep your streak alive!'; }
function upd(){ document.getElementById('score').textContent=score; document.getElementById('streak').textContent=streak; document.getElementById('time').textContent=Math.max(0,timeLeft); }
function begin(){ if(started)return; started=true; const total=45; timer=setInterval(()=>{ timeLeft--; upd(); document.getElementById('bar').style.width=(Math.max(0,timeLeft)/total*100)+'%'; if(timeLeft<=0)end(); },1000); }
function newRound(){ const wi=0|Math.random()*COLORS.length; isMatch=Math.random()<0.5; let ci; if(isMatch)ci=wi; else { do{ ci=0|Math.random()*COLORS.length; }while(ci===wi); }
  const el=document.getElementById('word'); el.textContent=COLORS[wi][0]; el.style.color=COLORS[ci][1]; }
function answer(said){ if(over)return; begin();
  if(said===isMatch){ score++; streak++; sfx('pop'); if(streak>0&&streak%6===0){ timeLeft+=3; document.getElementById('msg').textContent='Streak '+streak+'! +3s ⏱'; } else document.getElementById('msg').textContent='Correct!'; upd(); newRound(); }
  else { streak=0; score=Math.max(0,score-1); sfx('error'); document.getElementById('msg').textContent='Wrong! Streak reset.'; upd(); newRound(); }
}
function end(){ over=true; clearInterval(timer); if(score>best){ best=score; if(window.GH)GH.score.best(GAME,'best',best,'high'); } document.getElementById('best').textContent=best;
  document.getElementById('win-sub').textContent='Score '+score+'. Best '+best+'.'; setTimeout(()=>document.getElementById('win-overlay').classList.add('show'),300); }
newGame();
</script>
</body>
</html>
