<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pac-Man</title>
<link rel="stylesheet" href="shared.css">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="../themes/themes.css">
<script src="../themes/themes.js" defer></script>
<script src="../lang/lang.js" defer></script>
<style>
.pm-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 10px;}
#pacman{background:#000;border:2px solid var(--border);border-radius:10px;max-width:100%;touch-action:none;box-shadow:0 6px 24px rgba(0,0,0,.5);}
.pm-dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:6px;}
.pm-dpad button{font-size:20px;border-radius:10px;border:2px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;}
.pm-dpad button:active{background:rgba(240,192,64,.2);}
.pm-hint{font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--dim);text-align:center;}
</style>
</head>
<body>
<div class="hdr">
  <a class="back-btn" href="../index.html">← HUB</a>
  <span class="h-title" style="color:#f0c040">🟡 PAC-MAN</span>
  <div class="h-btns">
    <div class="info-pill">SCORE: <span id="score">0</span></div>
    <div class="info-pill">BEST: <span id="best">0</span></div>
    <div class="info-pill">LIVES: <span id="lives">3</span></div>
    <button class="hbtn" onclick="newGame()">NEW GAME</button>
  </div>
</div>
<div class="pm-wrap">
  <div class="pm-hint">Eat all the dots! Arrows / WASD / pad to steer. Grab a <b style="color:#f0c040">power pellet</b> to chase the ghosts.</div>
  <canvas id="pacman" width="420" height="340"></canvas>
  <div class="pm-dpad">
    <span></span><button onpointerdown="pd(event,0,-1)">▲</button><span></span>
    <button onpointerdown="pd(event,-1,0)">◀</button><span></span><button onpointerdown="pd(event,1,0)">▶</button>
    <span></span><button onpointerdown="pd(event,0,1)">▼</button><span></span>
  </div>
</div>
<div id="win-overlay">
  <div class="win-msg" id="win-msg">🏆 CLEARED!</div>
  <div class="win-sub" id="win-sub"></div>
  <div class="win-btns">
    <button class="win-btn" onclick="newGame()">PLAY AGAIN</button>
    <button class="win-btn sec" onclick="location.href='../index.html'">← HUB</button>
  </div>
</div>
<script>
const GAME='pacman';
function sfx(n){try{if(window.GH)GH.sfx.play(n);}catch(e){}}
const cv=document.getElementById('pacman'), ctx=cv.getContext('2d');
const MW=15, MH=11, CELL=28; // odd dims for maze gen
cv.width=MW*CELL; cv.height=MH*CELL;
let grid, pellets, pac, ghosts, score, best, lives, over, raf, tickMs=140, lastTick, frightened, pelletCount, gTick=0;
best=(window.GH?GH.score.get(GAME,'best'):0)||0;

function newGame(){ score=0; lives=3; over=false; buildMaze(); reset(); updateHud(); document.getElementById('win-overlay').classList.remove('show'); lastTick=0; cancelAnimationFrame(raf); raf=requestAnimationFrame(loop); }
function buildMaze(){
  // recursive-backtracker on odd grid: 1=wall,0=passage
  grid=Array.from({length:MH},()=>Array(MW).fill(1));
  function carve(x,y){ grid[y][x]=0; const d=[[0,-2],[0,2],[-2,0],[2,0]].sort(()=>Math.random()-0.5);
    for(const [dx,dy] of d){ const nx=x+dx,ny=y+dy; if(nx>0&&nx<MW-1&&ny>0&&ny<MH-1&&grid[ny][nx]===1){ grid[y+dy/2][x+dx/2]=0; carve(nx,ny); } } }
  carve(1,1);
  // add loops: knock out some interior walls
  for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++){ if(grid[y][x]===1 && Math.random()<0.16){ const hor=grid[y][x-1]===0&&grid[y][x+1]===0, ver=grid[y-1][x]===0&&grid[y+1][x]===0; if(hor||ver) grid[y][x]=0; } }
  // pellets on every passage
  pellets=Array.from({length:MH},()=>Array(MW).fill(0));
  pelletCount=0;
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++) if(grid[y][x]===0){ pellets[y][x]=1; pelletCount++; }
  // power pellets near the four corners (nearest passage)
  [[1,1],[MW-2,1],[1,MH-2],[MW-2,MH-2]].forEach(([x,y])=>{ const p=nearestPassage(x,y); if(p){ pellets[p[1]][p[0]]=2; } });
}
function nearestPassage(x,y){ if(grid[y]&&grid[y][x]===0)return[x,y]; for(let r=1;r<5;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const nx=x+dx,ny=y+dy; if(ny>0&&ny<MH-1&&nx>0&&nx<MW-1&&grid[ny][nx]===0)return[nx,ny];} return null; }
function reset(){
  // pac near center passage
  let cx=(MW/2)|0, cy=(MH/2)|0; const p=nearestPassage(cx,cy); pac={x:p[0],y:p[1],dx:0,dy:0,ndx:0,ndy:0,mouth:0};
  // ghosts at corners (far passages)
  const spots=[[1,1],[MW-2,1],[1,MH-2]].map(([x,y])=>nearestPassage(x,y)).filter(Boolean);
  const colors=['#e05050','#f090c0','#40d0e0'];
  ghosts=spots.map((s,i)=>({x:s[0],y:s[1],dx:0,dy:0,color:colors[i],home:s}));
  frightened=0;
}
function free(x,y){ return y>=0&&y<MH&&x>=0&&x<MW&&grid[y][x]===0; }
function loop(t){ if(over)return; if(t-lastTick>=tickMs){ lastTick=t; step(); } pac.mouth=(pac.mouth+0.25)%1; draw(); raf=requestAnimationFrame(loop); }
function step(){
  // pac turn if possible
  if((pac.ndx||pac.ndy)&&free(pac.x+pac.ndx,pac.y+pac.ndy)){ pac.dx=pac.ndx; pac.dy=pac.ndy; }
  if(free(pac.x+pac.dx,pac.y+pac.dy)){ pac.x+=pac.dx; pac.y+=pac.dy; }
  // eat
  if(pellets[pac.y][pac.x]===1){ pellets[pac.y][pac.x]=0; score+=10; pelletCount--; sfx('pop'); }
  else if(pellets[pac.y][pac.x]===2){ pellets[pac.y][pac.x]=0; score+=50; pelletCount--; frightened=24; sfx('coin'); }
  updateHud();
  if(pelletCount<=0) return clear();
  checkGhostCollision();
  // ghosts move (every tick; frightened = every other tick = slower)
  gTick++;
  if(!(frightened>0 && gTick%2===0)) moveGhosts();
  if(frightened>0) frightened--;
  checkGhostCollision();
}
function moveGhosts(){
  for(const g of ghosts){
    const opts=[[0,-1],[0,1],[-1,0],[1,0]].filter(([dx,dy])=>free(g.x+dx,g.y+dy) && !(dx===-g.dx&&dy===-g.dy));
    const choices=opts.length?opts:[[-g.dx,-g.dy]]; // allow reverse if dead-end
    let best=choices[0], bestScore=frightened>0?-1:1e9;
    for(const [dx,dy] of choices){
      const nx=g.x+dx, ny=g.y+dy; const dist=Math.abs(nx-pac.x)+Math.abs(ny-pac.y);
      if(frightened>0){ if(dist>bestScore){bestScore=dist;best=[dx,dy];} }
      else { const j=Math.random()*1.5; if(dist-j<bestScore){bestScore=dist-j;best=[dx,dy];} }
    }
    g.dx=best[0]; g.dy=best[1]; g.x+=g.dx; g.y+=g.dy;
  }
}
function checkGhostCollision(){
  for(const g of ghosts){ if(g.x===pac.x&&g.y===pac.y){
    if(frightened>0){ score+=200; sfx('hit'); const h=g.home; g.x=h[0]; g.y=h[1]; g.dx=0; g.dy=0; updateHud(); }
    else return die();
  }}
}
function die(){ lives--; sfx('lose'); updateHud(); if(lives<=0) return gameOver(false); reset(); }
function clear(){ sfx('win'); gameOver(true); }
function gameOver(won){
  over=true;
  const r=window.GH?GH.score.best(GAME,'best',score,'high'):{value:score,isBest:false}; best=r.value;
  document.getElementById('best').textContent=best;
  document.getElementById('win-msg').textContent=won?'🏆 CLEARED!':'💥 GAME OVER';
  document.getElementById('win-sub').textContent='Score '+score+(r.isBest&&score>0?' — NEW BEST! 🎉':' · Best '+best);
  setTimeout(()=>document.getElementById('win-overlay').classList.add('show'),300);
}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    if(grid[y][x]===1){ ctx.fillStyle='#1a1a6a'; ctx.fillRect(x*CELL+2,y*CELL+2,CELL-4,CELL-4); }
    else { const p=pellets[y][x]; if(p===1){ ctx.fillStyle='#f0d0a0'; ctx.beginPath();ctx.arc(x*CELL+CELL/2,y*CELL+CELL/2,2.5,0,7);ctx.fill(); } else if(p===2){ ctx.fillStyle='#f0c040'; ctx.beginPath();ctx.arc(x*CELL+CELL/2,y*CELL+CELL/2,6,0,7);ctx.fill(); } }
  }
  // pac
  const px=pac.x*CELL+CELL/2, py=pac.y*CELL+CELL/2;
  const ang=Math.atan2(pac.dy,pac.dx); const open=Math.abs(Math.sin(pac.mouth*Math.PI))*0.33+0.05;
  ctx.fillStyle='#f0c040'; ctx.beginPath(); ctx.moveTo(px,py); ctx.arc(px,py,CELL/2-3,ang+open*Math.PI,ang-open*Math.PI); ctx.closePath(); ctx.fill();
  // ghosts
  for(const g of ghosts){ const gx=g.x*CELL+CELL/2, gy=g.y*CELL+CELL/2, r=CELL/2-3;
    ctx.fillStyle=frightened>0?(frightened<6&&Math.floor(frightened*2)%2?'#fff':'#3030c0'):g.color;
    ctx.beginPath(); ctx.arc(gx,gy-1,r,Math.PI,0); ctx.lineTo(gx+r,gy+r); ctx.lineTo(gx+r*0.5,gy+r*0.6); ctx.lineTo(gx,gy+r); ctx.lineTo(gx-r*0.5,gy+r*0.6); ctx.lineTo(gx-r,gy+r); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath();ctx.arc(gx-3,gy-2,2.4,0,7);ctx.arc(gx+3,gy-2,2.4,0,7);ctx.fill();
    ctx.fillStyle='#113'; ctx.beginPath();ctx.arc(gx-3,gy-2,1.1,0,7);ctx.arc(gx+3,gy-2,1.1,0,7);ctx.fill();
  }
}
function updateHud(){ document.getElementById('score').textContent=score; document.getElementById('best').textContent=best; document.getElementById('lives').textContent=lives; }
function setDir(dx,dy){ if(over)return; pac.ndx=dx; pac.ndy=dy; }
function pd(e,dx,dy){ e.preventDefault(); setDir(dx,dy); }
document.addEventListener('keydown',e=>{ const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}; if(m[e.key]){e.preventDefault();setDir(m[e.key][0],m[e.key][1]);} });
newGame();
</script>
</body>
</html>
