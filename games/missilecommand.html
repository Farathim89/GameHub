<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Missile Command</title>
<link rel="stylesheet" href="shared.css">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="../themes/themes.css">
<script src="../themes/themes.js" defer></script>
<script src="../lang/lang.js" defer></script>
<style>
.mc-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 10px;}
#missile{background:#04040e;border:2px solid var(--border);border-radius:10px;max-width:100%;touch-action:none;cursor:crosshair;box-shadow:0 6px 24px rgba(0,0,0,.5);}
.mc-hint{font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--dim);text-align:center;}
</style>
</head>
<body>
<div class="hdr">
  <a class="back-btn" href="../index.html">← HUB</a>
  <span class="h-title" style="color:#40c0a0">🚀 MISSILE COMMAND</span>
  <div class="h-btns">
    <div class="info-pill">SCORE: <span id="score">0</span></div>
    <div class="info-pill">BEST: <span id="best">0</span></div>
    <div class="info-pill">WAVE: <span id="wave">1</span></div>
    <button class="hbtn" onclick="newGame()">NEW GAME</button>
  </div>
</div>
<div class="mc-wrap">
  <div class="mc-hint">Click/tap the sky to fire an interceptor — its blast destroys incoming missiles. Protect your cities!</div>
  <canvas id="missile" width="560" height="420"></canvas>
</div>
<div id="win-overlay">
  <div class="win-msg" id="win-msg">💥 GAME OVER</div>
  <div class="win-sub" id="win-sub"></div>
  <div class="win-btns">
    <button class="win-btn" onclick="newGame()">PLAY AGAIN</button>
    <button class="win-btn sec" onclick="location.href='../index.html'">← HUB</button>
  </div>
</div>
<script>
const GAME='missilecommand';
function sfx(n){try{if(window.GH)GH.sfx.play(n);}catch(e){}}
const cv=document.getElementById('missile'), ctx=cv.getContext('2d');
const W=cv.width, H=cv.height, GROUND=H-24;
let cities, missiles, interceptors, blasts, score, best, wave, over, raf, spawnT, toSpawn, spawned;
best=(window.GH?GH.score.get(GAME,'best'):0)||0;

function newGame(){
  score=0; wave=1; over=false;
  cities=[]; const n=6; for(let i=0;i<n;i++) cities.push({x:(i+0.5)*(W/n), alive:true});
  startWave();
  document.getElementById('best').textContent=best;
  updateHud();
  cancelAnimationFrame(raf); raf=requestAnimationFrame(loop);
}
function startWave(){
  missiles=[]; interceptors=[]; blasts=[]; spawnT=0; spawned=0; toSpawn=6+wave*2;
}
function loop(){ if(over)return; update(); draw(); raf=requestAnimationFrame(loop); }
function update(){
  spawnT++;
  if(spawned<toSpawn && spawnT>Math.max(16,50-wave*3)){ spawnT=0; spawnMissile(); spawned++; }
  // missiles
  for(const m of missiles){ if(m.dead)continue; m.x+=m.vx; m.y+=m.vy;
    if(m.y>=GROUND){ m.dead=true; hitGround(m.x); }
  }
  // interceptors
  for(const it of interceptors){ if(it.dead)continue; it.x+=it.vx; it.y+=it.vy;
    if((it.tx-it.x)*Math.sign(it.vx)<=0 && (it.ty-it.y)*Math.sign(it.vy)<=0){ it.dead=true; blasts.push({x:it.tx,y:it.ty,r:2,max:42}); sfx('hit'); }
  }
  // blasts expand & destroy missiles
  for(const b of blasts){ if(b.done)continue; b.r+=1.6; if(b.r>=b.max)b.done=true;
    for(const m of missiles){ if(m.dead)continue; if((m.x-b.x)**2+(m.y-b.y)**2 < b.r*b.r){ m.dead=true; score+=25; sfx('pop'); } }
  }
  missiles=missiles.filter(m=>!m.dead); interceptors=interceptors.filter(i=>!i.dead); blasts=blasts.filter(b=>!b.done);
  updateHud();
  if(cities.every(c=>!c.alive)) return gameOver();
  if(spawned>=toSpawn && !missiles.length && !blasts.length){ wave++; score+=cities.filter(c=>c.alive).length*50; startWave(); updateHud(); }
}
function spawnMissile(){
  const sx=Math.random()*W, tgt=cities[0|Math.random()*cities.length];
  const tx=tgt.alive?tgt.x: Math.random()*W, ty=GROUND;
  const dx=tx-sx, dy=ty, len=Math.hypot(dx,dy), sp=0.8+wave*0.25;
  missiles.push({x:sx,y:0,vx:dx/len*sp,vy:dy/len*sp,tx,ty});
}
function hitGround(x){ for(const c of cities){ if(c.alive&&Math.abs(c.x-x)<26){ c.alive=false; sfx('lose'); blasts.push({x:c.x,y:GROUND-6,r:2,max:30}); break; } } }
function fire(tx,ty){
  if(over||ty>GROUND-10) return;
  const sx=W/2, sy=GROUND-6; const dx=tx-sx, dy=ty-sy, len=Math.hypot(dx,dy), sp=8;
  interceptors.push({x:sx,y:sy,vx:dx/len*sp,vy:dy/len*sp,tx,ty}); sfx('select');
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#2a2a38'; ctx.fillRect(0,GROUND,W,H-GROUND);
  // battery
  ctx.fillStyle='#40c0a0'; ctx.beginPath(); ctx.moveTo(W/2-10,GROUND); ctx.lineTo(W/2+10,GROUND); ctx.lineTo(W/2,GROUND-14); ctx.closePath(); ctx.fill();
  // cities
  for(const c of cities){ ctx.fillStyle=c.alive?'#5090e0':'#3a2020'; for(let i=0;i<3;i++) ctx.fillRect(c.x-16+i*11,GROUND-10-(i===1?6:0),8,10+(i===1?6:0)); }
  // missiles with trails
  for(const m of missiles){ ctx.strokeStyle='#e05050'; ctx.beginPath(); ctx.moveTo(m.x-m.vx*6,m.y-m.vy*6); ctx.lineTo(m.x,m.y); ctx.stroke(); ctx.fillStyle='#ffb0b0'; ctx.fillRect(m.x-1.5,m.y-1.5,3,3); }
  // interceptors
  for(const it of interceptors){ ctx.strokeStyle='#40c0e0'; ctx.beginPath(); ctx.moveTo(W/2,GROUND-6); ctx.lineTo(it.x,it.y); ctx.stroke(); ctx.fillStyle='#fff'; ctx.fillRect(it.x-1.5,it.y-1.5,3,3); ctx.fillStyle='#f0c040'; ctx.fillRect(it.tx-1,it.ty-1,2,2); }
  // blasts
  for(const b of blasts){ ctx.fillStyle='rgba(240,192,64,'+(1-b.r/b.max)*0.9+')'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill(); }
}
function updateHud(){ document.getElementById('score').textContent=score; document.getElementById('best').textContent=best; document.getElementById('wave').textContent=wave; }
function gameOver(){
  over=true;
  const r=window.GH?GH.score.best(GAME,'best',score,'high'):{value:score,isBest:false}; best=r.value;
  document.getElementById('best').textContent=best;
  document.getElementById('win-sub').textContent='Score '+score+' · wave '+wave+(r.isBest&&score>0?' — NEW BEST! 🎉':'');
  setTimeout(()=>document.getElementById('win-overlay').classList.add('show'),300);
}
cv.addEventListener('click',e=>{ const rect=cv.getBoundingClientRect(); fire((e.clientX-rect.left)*(W/rect.width),(e.clientY-rect.top)*(H/rect.height)); });
cv.addEventListener('touchstart',e=>{e.preventDefault(); const rect=cv.getBoundingClientRect(); fire((e.touches[0].clientX-rect.left)*(W/rect.width),(e.touches[0].clientY-rect.top)*(H/rect.height));},{passive:false});
newGame();
</script>
</body>
</html>
