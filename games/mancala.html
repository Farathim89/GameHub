<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mancala</title>
<link rel="stylesheet" href="shared.css">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="../themes/themes.css">
<script src="../themes/themes.js" defer></script>
<script src="../lang/lang.js" defer></script>
<style>
.mc-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 12px;}
.mc-board{display:flex;align-items:stretch;gap:clamp(5px,1.6vw,10px);background:linear-gradient(145deg,#3a2614,#241408);border:3px solid #5a3c20;border-radius:26px;padding:clamp(8px,2.5vw,14px);box-shadow:0 8px 30px rgba(0,0,0,.6);max-width:100%;box-sizing:border-box;}
.mc-store{width:clamp(40px,12vw,66px);border-radius:30px;background:#1a0f06;border:2px solid #4a301a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#f0c040;font-family:'Orbitron',monospace;}
.mc-store .n{font-size:clamp(18px,7vw,26px);font-weight:900;}
.mc-store .l{font-size:9px;color:var(--dim);letter-spacing:1px;}
.mc-mid{display:flex;flex-direction:column;gap:10px;justify-content:center;}
.mc-row{display:flex;gap:clamp(5px,1.6vw,10px);}
.mc-pit{width:clamp(30px,9vw,58px);height:clamp(30px,9vw,58px);border-radius:50%;background:#1a0f06;border:2px solid #4a301a;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-size:clamp(14px,5vw,20px);font-weight:900;color:#f0e0b0;cursor:default;transition:transform .12s,box-shadow .12s;position:relative;}
.mc-pit.mine{cursor:pointer;border-color:#f0c040;}
.mc-pit.mine:hover{transform:scale(1.08);box-shadow:0 0 14px rgba(240,192,64,.4);}
.mc-pit.empty{opacity:.5;}
.mc-lbl{font-family:'Orbitron',monospace;font-size:11px;color:var(--dim);letter-spacing:2px;}
.mc-turn{font-family:'Orbitron',monospace;font-size:16px;font-weight:700;min-height:24px;letter-spacing:1px;}
</style>
</head>
<body>
<div class="hdr">
  <a class="back-btn" href="../index.html">← HUB</a>
  <span class="h-title" style="color:#f0a040">⚱️ MANCALA</span>
  <div class="h-btns">
    <select id="mode-sel" onchange="newGame()">
      <option value="2p">2 PLAYERS</option>
      <option value="ai" selected>VS AI</option>
    </select>
    <button class="hbtn" onclick="newGame()">NEW GAME</button>
  </div>
</div>
<div class="mc-wrap">
  <div class="mc-turn" id="turn">Your turn</div>
  <div class="mc-lbl" id="topLbl">🤖 AI</div>
  <div class="mc-board">
    <div class="mc-store"><div class="n" id="st13">0</div><div class="l">AI</div></div>
    <div class="mc-mid">
      <div class="mc-row" id="topRow"></div>
      <div class="mc-row" id="botRow"></div>
    </div>
    <div class="mc-store"><div class="n" id="st6">0</div><div class="l">YOU</div></div>
  </div>
  <div class="mc-lbl" id="botLbl">🟡 YOU</div>
</div>
<div id="win-overlay">
  <div class="win-msg" id="win-msg">🏆 YOU WIN!</div>
  <div class="win-sub" id="win-sub"></div>
  <div class="win-btns">
    <button class="win-btn" onclick="newGame()">PLAY AGAIN</button>
    <button class="win-btn sec" onclick="location.href='../index.html'">← HUB</button>
  </div>
</div>
<script>
const GAME='mancala';
function sfx(n){try{if(window.GH)GH.sfx.play(n);}catch(e){}}
// board[0..5]=player pits, [6]=player store, [7..12]=AI pits, [13]=AI store
let board=[], turn=0, mode='ai', over=false, busy=false;

function newGame(){
  mode=document.getElementById('mode-sel').value;
  board=[4,4,4,4,4,4,0, 4,4,4,4,4,4,0];
  turn=0; over=false; busy=false;
  document.getElementById('topLbl').textContent = mode==='ai'?'🤖 AI':'🟣 PLAYER 2';
  document.querySelector('.mc-store:first-child .l').textContent = mode==='ai'?'AI':'P2';
  document.getElementById('win-overlay').classList.remove('show');
  render(); setTurn();
}
function ownStore(p){ return p===0?6:13; }
function oppStore(p){ return p===0?13:6; }
function inSide(p,i){ return p===0 ? (i>=0&&i<=5) : (i>=7&&i<=12); }

function sow(start){
  let p=turn;
  let seeds=board[start]; board[start]=0;
  let i=start;
  while(seeds>0){
    i=(i+1)%14;
    if(i===oppStore(p)) continue; // skip opponent's store
    board[i]++; seeds--;
  }
  // last seed landed in i
  let extra=false;
  if(i===ownStore(p)){ extra=true; }
  else if(inSide(p,i) && board[i]===1){ // capture
    const opp=12-i; // opposite pit index (0<->12,1<->11,...5<->7)
    if(board[opp]>0){ board[ownStore(p)] += board[opp]+1; board[i]=0; board[opp]=0; }
  }
  return extra;
}
function sideEmpty(p){ const pits=p===0?[0,1,2,3,4,5]:[7,8,9,10,11,12]; return pits.every(i=>board[i]===0); }
function checkEnd(){
  if(sideEmpty(0)||sideEmpty(1)){
    // sweep remaining to each store
    for(let i=0;i<=5;i++){ board[6]+=board[i]; board[i]=0; }
    for(let i=7;i<=12;i++){ board[13]+=board[i]; board[i]=0; }
    return true;
  }
  return false;
}
function play(i){
  if(over||busy) return;
  if(mode==='ai'&&turn===1) return;
  if(!inSide(turn,i)||board[i]===0) { sfx('error'); return; }
  const extra=sow(i);
  sfx('place');
  if(checkEnd()){ render(); return endGame(); }
  if(!extra){ turn=1-turn; }
  render(); setTurn();
  if(mode==='ai'&&turn===1&&!over){ busy=true; setTimeout(aiMove,560); }
}
function aiMove(){
  if(over) return;
  const i=chooseAI();
  const extra=sow(i);
  sfx('place');
  if(checkEnd()){ busy=false; render(); return endGame(); }
  render();
  if(extra && !over){ setTimeout(aiMove,480); return; }
  turn=0; busy=false; setTurn();
}
function chooseAI(){
  const pits=[7,8,9,10,11,12].filter(i=>board[i]>0);
  // 1) move that lands in own store (extra turn)
  for(const i of pits){ const dist=13-i; if(board[i]%14===dist || board[i]===dist) return i; }
  // evaluate by simple gain (store delta incl. capture) via simulation
  let best=pits[0], bestVal=-1;
  for(const i of pits){
    const snap=board.slice(); const t0=turn;
    const extra=simSow(i,1);
    const val=board[13]-snap[13] + (extra?3:0);
    board=snap; turn=t0;
    if(val>bestVal){ bestVal=val; best=i; }
  }
  return best;
}
function simSow(start,p){
  let seeds=board[start]; board[start]=0; let i=start;
  while(seeds>0){ i=(i+1)%14; if(i===oppStore(p))continue; board[i]++; seeds--; }
  let extra=false;
  if(i===ownStore(p)) extra=true;
  else if(inSide(p,i)&&board[i]===1){ const opp=12-i; if(board[opp]>0){ board[ownStore(p)]+=board[opp]+1; board[i]=0; board[opp]=0; } }
  return extra;
}
function render(){
  // top row = AI pits 12..7 (left to right), bottom = player 0..5
  const top=document.getElementById('topRow'); top.innerHTML='';
  for(let i=12;i>=7;i--){ top.appendChild(pitEl(i, mode==='2p'&&turn===1)); }
  const bot=document.getElementById('botRow'); bot.innerHTML='';
  for(let i=0;i<=5;i++){ bot.appendChild(pitEl(i, turn===0 && !(mode==='ai'&&turn===1))); }
  document.getElementById('st6').textContent=board[6];
  document.getElementById('st13').textContent=board[13];
}
function pitEl(i,clickable){
  const d=document.createElement('div');
  const mine = (i<=5&&turn===0)||(i>=7&&turn===1);
  const canClick = clickable && mine && board[i]>0 && !over && !(mode==='ai'&&turn===1);
  d.className='mc-pit'+(canClick?' mine':'')+(board[i]===0?' empty':'');
  d.textContent=board[i];
  if(canClick) d.onclick=()=>play(i);
  return d;
}
function setTurn(){
  if(over)return;
  const el=document.getElementById('turn');
  el.textContent = turn===0 ? 'Your turn' : (mode==='ai'?'🤖 AI thinking…':'Player 2’s turn');
  el.style.color = turn===0?'#f0c040':'#e05050';
}
function endGame(){
  over=true;
  const you=board[6], them=board[13];
  const win=you>them, tie=you===them;
  if(win&&window.GH)GH.score.inc(GAME,'wins',1);
  document.getElementById('win-msg').textContent= tie?'🤝 TIE!':(win?(mode==='ai'?'🏆 YOU WIN!':'🏆 PLAYER 1 WINS!'):(mode==='ai'?'🤖 AI WINS!':'🏆 PLAYER 2 WINS!'));
  document.getElementById('win-sub').textContent='Final '+you+' — '+them;
  setTimeout(()=>document.getElementById('win-overlay').classList.add('show'),350);
}
newGame();
</script>
</body>
</html>
