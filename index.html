<link rel="icon" href="icons/icon-192.png">

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#080808;--surface:#111;--surface2:#1a1a1a;
  --accent:#f0c040;--red:#e05050;--green:#40c0a0;--blue:#5090e0;
  --text:#f0f0f0;--dim:#666;--border:#2a2a2a;
}
body{background:var(--bg);color:var(--text);font-family:'Share Tech Mono',monospace;min-height:100vh;}
#hub{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:24px;}
.hub-logo{font-family:'Orbitron',monospace;font-size:clamp(32px,6vw,64px);font-weight:900;color:var(--accent);letter-spacing:6px;text-shadow:0 0 40px rgba(240,192,64,.4);text-align:center;}
.hub-sub{font-size:14px;color:var(--dim);letter-spacing:3px;}
.cat-lbl{font-family:'Orbitron',monospace;font-size:11px;color:var(--dim);letter-spacing:4px;width:100%;max-width:1100px;padding-top:6px;border-bottom:1px solid var(--border);padding-bottom:6px;}
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;max-width:1100px;width:100%;}
.gcard{background:var(--surface);border:2px solid var(--border);border-radius:14px;padding:20px 14px;cursor:pointer;transition:all .25s;text-align:center;}
.gcard:hover{transform:translateY(-5px);}
.gcard-icon{font-size:38px;margin-bottom:8px;}
.gcard-name{font-family:'Orbitron',monospace;font-size:12px;font-weight:700;letter-spacing:2px;margin-bottom:5px;}
.gcard-desc{font-size:11px;color:var(--dim);line-height:1.5;}
#install-btn{
  display:none;font-family:'Orbitron',monospace;font-size:12px;font-weight:700;
  padding:10px 22px;border-radius:8px;border:2px solid var(--green);color:var(--green);
  background:var(--surface2);cursor:pointer;letter-spacing:2px;transition:all .2s;
}
#install-btn:hover{background:rgba(64,192,160,.12);}
#hub-search{font-family:'Share Tech Mono',monospace;font-size:14px;background:var(--surface);border:2px solid var(--border);color:var(--text);padding:11px 16px;border-radius:10px;outline:none;width:100%;max-width:360px;transition:border-color .2s;}
#hub-search:focus{border-color:var(--accent);}
#hub-search::placeholder{color:var(--dim);}
.no-results{color:var(--dim);font-family:'Orbitron',monospace;font-size:13px;letter-spacing:2px;padding:30px;}
@keyframes cardIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.gcard{animation:cardIn .35s ease both;}
.gcard:hover{transform:translateY(-5px)!important;}
</style>
</head>
<body>
<div id="hub">

const area = document.getElementById('grid-area');
const TOTAL = CATEGORIES.reduce((n,c)=>n+c.games.length,0);
document.getElementById('hub-sub').textContent = TOTAL + ' GAMES · CHOOSE YOUR GAME';

const sections = [];
let cardN = 0;
CATEGORIES.forEach(cat => {
  const lbl = document.createElement('div');
  lbl.className = 'cat-lbl';
  lbl.textContent = cat.label;
  area.appendChild(lbl);
  const grid = document.createElement('div');
  grid.className = 'game-grid';
  const cards = [];
  cat.games.forEach(g => {
    const el = document.createElement('div');
    el.className = 'gcard';
    el.style.animationDelay = Math.min(cardN*18, 700) + 'ms'; cardN++;
    el.dataset.search = (g.name + ' ' + g.desc).toLowerCase();
    el.innerHTML = `<div class="gcard-icon">${g.icon}</div><div class="gcard-name" style="color:${g.color}">${g.name}</div><div class="gcard-desc">${g.desc}</div>`;
    el.addEventListener('mouseenter',()=>{ el.style.borderColor=g.color; el.style.boxShadow=`0 8px 30px ${g.color}33`; });
    el.addEventListener('mouseleave',()=>{ el.style.borderColor=''; el.style.boxShadow=''; });
    el.onclick = () => window.location.href = g.file;
    grid.appendChild(el);
    cards.push(el);
  });
  area.appendChild(grid);
  sections.push({ lbl, grid, cards });
});

/* ── live search filter ── */
const search = document.getElementById('hub-search');
let noRes = null;
search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase();
  let shown = 0;
  sections.forEach(sec => {
    let any = false;
    sec.cards.forEach(c => { const m = !q || c.dataset.search.includes(q); c.hidden = !m; if(m){any=true;shown++;} });
    sec.lbl.hidden = !any; sec.grid.hidden = !any;
  });
  if (!noRes) { noRes = document.createElement('div'); noRes.className = 'no-results'; noRes.textContent = 'No games match your search.'; area.appendChild(noRes); }
  noRes.hidden = shown !== 0;
});

/* ── PWA: service worker + install prompt (needs http(s)/localhost, not file://) ── */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-btn').style.display = 'inline-block';
});
document.getElementById('install-btn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('install-btn').style.display = 'none';
});
</script>
</body>
